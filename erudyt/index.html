<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ерудит</title>
<meta name="description" content="Сімейна вікторина на 2–4 гравців: від простих питань до складних, на час.">
<meta name="theme-color" content="#1d1530">
<meta property="og:title" content="Ерудит 🦉">
<meta property="og:description" content="Заходь на сімейну вікторину — хто з нас ерудит?">
<meta property="og:image" content="https://cluckh.github.io/destiny/erudyt/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ерудит">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1d1530; --panel:#2d2142; --panel-2:#3a2a52; --line:#4b3866; --shadow:#150e22;
  --cream:#fff2de; --muted:#c4afc7; --ink:#2a1608;
  --pumpkin:#f08a3c; --pumpkin-d:#b5591c;
  --mustard:#f4b942; --mustard-d:#b78220;
  --sage:#93b977; --sage-d:#5d7f46;
  --berry:#e35a72; --berry-d:#9e2f46;
  --sky:#7fb7d9; --sky-d:#45799c;
  --spring:cubic-bezier(.3,1.55,.55,1);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100dvh;background:var(--night);color:var(--cream);
  font-family:'Nunito',system-ui,-apple-system,sans-serif;font-weight:700;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
h1,h2,h3,.disp{font-family:'Unbounded',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.hidden{display:none!important}
.muted{color:var(--muted);font-weight:600}
.center{text-align:center}

/* ---------- evening sky ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(130% 55% at 50% 112%, #d0602e 0%, #9a4126 20%, rgba(106,44,51,0) 58%),
    linear-gradient(180deg,#191330 0%,#2a1a3f 42%,#46223f 72%,#652b35 100%);}
.stars{position:absolute;inset:0 0 40% 0;opacity:.75;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%,#fff 50%,transparent 51%),
    radial-gradient(1.2px 1.2px at 28% 8%,#ffe9c7 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 44% 26%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 61% 12%,#fff 50%,transparent 51%),
    radial-gradient(1.8px 1.8px at 72% 30%,#ffe9c7 50%,transparent 51%),
    radial-gradient(1.2px 1.2px at 90% 16%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 6% 40%,#fff 50%,transparent 51%),
    radial-gradient(1.3px 1.3px at 36% 44%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 82% 48%,#ffe9c7 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 54% 38%,#fff 50%,transparent 51%);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:.9}}
.moon{position:absolute;top:7%;right:9%;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fff6e4,#f6d9a8 60%,#e9bd7c);
  box-shadow:0 0 40px 12px rgba(255,214,150,.22),0 0 120px 40px rgba(255,170,90,.12)}
.moon::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(200,150,90,.25);top:22px;left:40px;box-shadow:-18px 18px 0 -3px rgba(200,150,90,.2)}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh}
.leaves{position:absolute;inset:0}
.leaf{position:absolute;top:-40px;will-change:transform;animation:fall linear infinite}
.leaf svg{display:block;animation:sway ease-in-out infinite alternate}
@keyframes fall{to{transform:translateY(112vh)}}
@keyframes sway{from{transform:translateX(-22px) rotate(-35deg)}to{transform:translateX(22px) rotate(40deg)}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.screen{display:flex;flex-direction:column;gap:16px}
.enter>*{animation:rise .55s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}
.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}
.enter>*:nth-child(6){animation-delay:.3s}.enter>*:nth-child(7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes wiggle{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-6px) rotate(-12deg)}}
.pop{animation:pop .6s var(--spring) both}
.bob{animation:bob 2.6s ease-in-out infinite}
.shake{animation:shake .5s ease both}

/* ---------- blocks ---------- */
.card{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:0 7px 0 var(--shadow),0 18px 34px rgba(0,0,0,.35)}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
input[type=text],textarea{width:100%;border:3px solid var(--line);background:#231936;border-radius:14px;
  padding:13px 14px;font-size:17px;font-weight:800;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--cream)}
textarea{resize:none;min-height:88px;line-height:1.35}
input::placeholder,textarea::placeholder{color:#8d7896;font-weight:700}
input:focus,textarea:focus{border-color:var(--pumpkin);box-shadow:0 0 0 4px rgba(240,138,60,.2)}

.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em;
  border:0;border-radius:18px;padding:17px 20px;color:var(--ink);
  --b:var(--pumpkin);--bd:var(--pumpkin-d);background:var(--b);
  box-shadow:0 6px 0 var(--bd),0 12px 20px rgba(0,0,0,.35);
  transition:transform .14s var(--spring),box-shadow .14s,filter .2s,opacity .2s}
.btn::before{content:'';position:absolute;left:12px;right:12px;top:6px;height:9px;border-radius:9px;background:rgba(255,255,255,.3);pointer-events:none}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--bd),0 4px 8px rgba(0,0,0,.3)}
.btn:disabled{filter:grayscale(.7) brightness(.75);cursor:default}
.btn.mustard{--b:var(--mustard);--bd:var(--mustard-d)}
.btn.sage{--b:var(--sage);--bd:var(--sage-d)}
.btn.blue{--b:var(--sky);--bd:var(--sky-d)}
.btn.ghost{--b:var(--panel-2);--bd:var(--shadow);color:var(--cream)}
.btn.ghost::before{background:rgba(255,255,255,.07)}
.btn.small{font-size:14px;padding:12px 14px;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.chip{border:0;border-radius:999px;padding:9px 14px;background:var(--panel-2);font-weight:800;font-size:14px;
  box-shadow:0 4px 0 var(--shadow);transition:transform .14s var(--spring),box-shadow .14s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.tag{display:inline-block;font-family:'Unbounded';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  background:rgba(244,185,66,.16);color:var(--mustard);padding:6px 10px;border-radius:999px}

/* ---------- avatar ---------- */
.ava{flex:none;border-radius:22%;background:radial-gradient(circle at 50% 30%,#4a3866,#2b1f40);overflow:hidden;
  border:3px solid var(--line);box-shadow:0 5px 0 var(--shadow)}
.ava svg{display:block;width:100%;height:100%}
.ava.xs{width:34px;height:34px;border-width:2px;box-shadow:0 3px 0 var(--shadow)}
.ava.sm{width:46px;height:46px}
.ava.md{width:64px;height:64px}
.ava.lg{width:96px;height:96px}
.ava.xl{width:124px;height:124px;border-radius:28px}

/* ---------- home ---------- */
.logo{text-align:center;padding:14px 0 2px}
.logo-badge{width:66px;height:66px;margin:0 auto 12px;display:grid;place-items:center;font-size:36px;border-radius:20px;
  background:var(--mustard);box-shadow:0 6px 0 var(--mustard-d),0 14px 26px rgba(0,0,0,.35);transform:rotate(-8deg);animation:bob 3.2s ease-in-out infinite}
.logo h1{font-size:40px;font-weight:800;line-height:.98;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.logo h1 span{color:var(--pumpkin);display:inline-block;transform:rotate(-3deg)}
.logo p{margin:12px auto 0;max-width:300px}
.invite{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#5a2c4a,#3a2552);border-color:#7a4466}
.invite .ico{font-size:30px;animation:wiggle 1.6s ease-in-out infinite}

.ed-top{display:flex;gap:16px;align-items:center}
.ed-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ed-side .chip{align-self:flex-start}
.tabs{display:flex;gap:6px;margin:18px 0 12px;background:#231936;padding:5px;border-radius:16px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:800;color:var(--muted);transition:background .25s var(--ease),color .25s}
.tabs button.on{background:var(--panel-2);color:var(--cream);box-shadow:0 3px 0 var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.grid button{aspect-ratio:1;border:3px solid transparent;border-radius:16px;background:#231936;padding:3px;transition:transform .2s var(--spring),border-color .2s}
.grid button svg{width:100%;height:100%;display:block}
.grid button.on{border-color:var(--pumpkin);transform:scale(1.06);background:#3b2850}
.grid button:active{transform:scale(.92)}
.swatch{display:block;width:100%;height:100%;border-radius:11px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.25)}
.ava-pop{animation:pop .45s var(--spring)}

/* ---------- lobby ---------- */
.versus{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:8px 0}
.versus .slot{display:flex;flex-direction:column;align-items:center;gap:10px;width:42%}
.versus .slot b{font-family:'Unbounded';font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.versus .vs{font-family:'Unbounded';font-weight:800;color:var(--mustard);font-size:20px;transform:rotate(-8deg)}
.empty-slot{width:96px;height:96px;border-radius:22%;border:3px dashed #6b5590;display:grid;place-items:center;font-family:'Unbounded';font-size:34px;color:#8e78b2;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.status{display:flex;align-items:center;gap:10px;justify-content:center;font-size:14px;color:var(--muted);font-weight:700}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--pumpkin);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbox{font-size:13px;color:var(--muted);background:#231936;border-radius:12px;padding:10px 12px;word-break:break-all;font-weight:700}
.linkbox.sel{-webkit-user-select:all;user-select:all;-webkit-touch-callout:default;font-size:14px;color:var(--cream);cursor:text}

/* ---------- game top ---------- */
.top{display:flex;align-items:center;gap:8px}
.pl{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:7px 10px 7px 7px;box-shadow:0 5px 0 var(--shadow);position:relative;transition:border-color .3s}
.pl.right{flex-direction:row-reverse;padding:7px 7px 7px 10px;text-align:right}
.pl.turn{border-color:var(--mustard)}
.pl .meta{min-width:0;flex:1}
.pl .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-family:'Unbounded';font-weight:800;font-size:19px;line-height:1.1;display:inline-block}
.pl .sc.bump{animation:pop .55s var(--spring)}
.pl .dot{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:#7c6a86;border:3px solid var(--night)}
.pl:not(.right) .dot{left:-4px}.pl.right .dot{right:-4px}
.pl .dot.on{background:#7ee08a;box-shadow:0 0 10px #7ee08a}
.pl .role{position:absolute;bottom:-9px;font-size:15px}
.pl:not(.right) .role{left:34px}.pl.right .role{right:34px}
.menu-btn{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--panel-2);box-shadow:0 5px 0 var(--shadow);font-size:20px;font-weight:900}
.banner{border-radius:14px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;background:rgba(227,90,114,.18);border:2px solid rgba(227,90,114,.4);animation:rise .4s var(--ease)}

/* ---------- stage ---------- */
#stage{display:flex;flex-direction:column;gap:12px}
#banner:empty{display:none}
.stage-head{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stage-head h2{font-size:26px;font-weight:800;line-height:1.1}
.stage-head p{margin:0}
.qcard{display:flex;gap:14px;align-items:flex-start}
.qcard .who{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:3px}
.qtext{font-family:'Unbounded';font-weight:600;font-size:19px;line-height:1.3;word-wrap:break-word;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{--c:var(--pumpkin);position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 14px;border-radius:18px;border:3px solid transparent;background:var(--panel-2);
  box-shadow:0 5px 0 var(--shadow);font-weight:800;font-size:17px;line-height:1.25;
  transition:transform .3s var(--spring),background .25s,border-color .25s,box-shadow .2s,opacity .3s}
.opt .let{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-family:'Unbounded';font-size:15px;
  background:var(--c);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt:active:not(:disabled){transform:scale(.97)}
.opt.sel{border-color:var(--c);transform:scale(1.03);background:#4a3466}
.opt.right{background:var(--sage);color:var(--ink);border-color:#c8e6b0}
.opt.right .let{background:#fff2de}
.opt.wrong{background:var(--berry);color:var(--ink)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.opt .badge{font-size:12px;font-weight:900;padding:4px 8px;border-radius:999px;background:rgba(147,185,119,.22);color:var(--sage);white-space:nowrap}
.opt.right .badge{background:rgba(42,22,8,.15);color:var(--ink)}
.finger{position:absolute;right:-6px;top:50%;font-size:30px;margin-top:-20px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.opt.sel .finger{opacity:1;transform:scale(1);animation:wiggle .9s ease-in-out infinite}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.seg button{border:3px solid transparent;border-radius:16px;background:#231936;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;
  box-shadow:0 4px 0 var(--shadow);transition:transform .25s var(--spring),border-color .2s,background .2s}
.seg button .e{font-size:24px}
.seg button b{font-family:'Unbounded';font-size:17px}
.seg button small{font-size:12px;color:var(--muted);font-weight:800}
.seg button.on{border-color:var(--mustard);background:#3f2c4f;transform:translateY(-3px)}

.optedit{--c:var(--pumpkin);display:flex;gap:9px;align-items:center;margin-bottom:10px;animation:rise .35s var(--ease) both}
.optedit .mark{width:46px;height:46px;flex:none;border-radius:14px;border:3px solid var(--c);background:transparent;display:grid;place-items:center;
  font-family:'Unbounded';font-size:15px;color:var(--c);transition:transform .25s var(--spring),background .2s,color .2s}
.optedit.ok .mark{background:var(--sage);border-color:var(--sage);color:var(--ink);transform:rotate(-8deg) scale(1.05)}
.optedit input{flex:1;min-width:0}
.optedit .rm{width:34px;height:34px;flex:none;border-radius:10px;border:0;background:transparent;color:#8d7896;font-size:18px}
.hint{font-size:13px;color:var(--muted);margin:2px 0 12px}
.err{color:#ff9aa9;font-size:14px;font-weight:800;min-height:20px;text-align:center;margin-top:-6px}

.wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 18px}
.wait h2{font-size:21px;line-height:1.2}
.typing{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--mustard);min-height:24px;transition:opacity .25s}
.typing.off{opacity:0}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

.result{text-align:center;border-radius:24px;padding:20px 16px;color:var(--ink);box-shadow:0 7px 0 var(--sage-d),0 18px 30px rgba(0,0,0,.35);background:var(--sage)}
.result.bad{background:var(--berry);box-shadow:0 7px 0 var(--berry-d),0 18px 30px rgba(0,0,0,.35)}
.result .big{font-family:'Unbounded';font-weight:800;font-size:30px;line-height:1.05}
.result .delta{font-family:'Unbounded';font-weight:800;font-size:22px;margin-top:6px}
.result .sub{font-weight:800;margin-top:6px;font-size:15px;opacity:.85}
.story-text{font-size:17px;font-weight:700;font-style:italic;min-height:24px;overflow-wrap:anywhere}
.story-text.empty{color:#8d7896;font-style:normal}

.mirror-banner{font-family:'Unbounded';font-weight:800;font-size:22px;text-align:center;padding:14px;border-radius:20px;
  background:linear-gradient(135deg,#7fb7d9,#b8a1f2);color:var(--ink);box-shadow:0 6px 0 #4d5f9c,0 14px 26px rgba(0,0,0,.35)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .card{padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.duo .nm{font-family:'Unbounded';font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo .k{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.duo .v{font-weight:900;font-size:15px}
.pill{display:inline-block;font-family:'Unbounded';font-size:13px;padding:5px 10px;border-radius:999px;background:var(--sage);color:var(--ink)}
.pill.no{background:var(--berry)}
.meter{height:16px;border-radius:999px;background:#231936;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pumpkin),var(--mustard));transition:width 1.2s var(--ease)}
.donecheck{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.donecheck span{display:inline-flex;align-items:center;gap:7px;background:#231936;border-radius:999px;padding:5px 12px 5px 5px;font-size:14px}

/* reactions */
.react{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:5;display:flex;gap:4px;
  background:rgba(45,33,66,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 6px 0 var(--shadow)}
.react button{width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:24px;transition:transform .2s var(--spring)}
.react button:active{transform:scale(1.35)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.float{position:absolute;bottom:80px;font-size:44px;will-change:transform,opacity}

<script>
'use strict';
/* =========================================================
   Ерудит — сімейна вікторина на 2–4 гравців; зв’язок через relay.js (MQTT-брокери)
   Господар кімнати тримає стан гри й таймери, гості надсилають відповіді.
   ========================================================= */

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[rnd(arr.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('er:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('er:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('er:' + k); } catch (e) {} },
};
function throttle(fn, ms) {
  let last = 0, timer = null, lastArgs;
  return (...args) => {
    lastArgs = args;
    const now = Date.now();
    if (now - last >= ms) { last = now; fn(...args); }
    else if (!timer) timer = setTimeout(() => { timer = null; last = Date.now(); fn(...lastArgs); }, ms - (now - last));
  };
}


const NICKS = ['Гарбузик', 'Кленовий Лис', 'Їжачок', 'Какао-Кіт', 'Пледик', 'Жолудь', 'Листопадик', 'Нічна Сова', 'Каштан', 'Глінтвейн', 'Шарфик', 'Грибочок'];
const REACTIONS = ['😂', '😱', '🥰', '🤔', '🔥', '🍂'];

/* ---------- questions ----------
   [складність 1–3, категорія, питання, [правильна, хибна, хибна, хибна], «а ви знали?»] */
const CATS = {
  geo: ['🌍', 'Географія'], his: ['📜', 'Історія'], nat: ['🌿', 'Природа'], sci: ['🔬', 'Наука'],
  art: ['🎨', 'Мистецтво'], lit: ['📚', 'Література'], mus: ['🎬', 'Музика й кіно'], spo: ['⚽', 'Спорт'],
  ua: ['🇺🇦', 'Україна'], food: ['🍲', 'Їжа'], math: ['➗', 'Математика'], fun: ['🎲', 'Різне'],
};
const Q = [
  // ---------- легкі ----------

/* ---------- avatars (blocky, roblox-like) ---------- */
const SKINS = ['#f7c873', '#f39a4f', '#ec6a5e', '#a6cf7e', '#78c3d6', '#b8a1f2', '#f5a9c4', '#d39a68', '#8d5b3d', '#efe2cb'];

const HATS = ['none', 'cap', 'beanie', 'crown', 'leaf', 'pumpkin', 'headphones', 'bow', 'tophat', 'horns'];
const INK = '#2b1a14';

function faceSVG(f) {
  const eyes = `<ellipse cx="47" cy="52" rx="4.5" ry="6.5" fill="${INK}"/><ellipse cx="73" cy="52" rx="4.5" ry="6.5" fill="${INK}"/>`;
  const st = `stroke="${INK}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  switch (f) {
    case 'grin': return eyes + `<path d="M43 63 H77 Q75 83 60 83 Q45 83 43 63Z" fill="${INK}"/><path d="M47 64 H73 V69 Q60 71 47 69Z" fill="#fff"/>`;
    case 'wink': return `<ellipse cx="47" cy="52" rx="4.5" ry="6.5" fill="${INK}"/><path d="M66 54 Q73 46 80 54" ${st}/><path d="M46 66 Q61 78 75 64" ${st}/>`;
    case 'cool': return `<rect x="34" y="44" width="23" height="14" rx="5" fill="${INK}"/><rect x="63" y="44" width="23" height="14" rx="5" fill="${INK}"/><path d="M56 49 H64" stroke="${INK}" stroke-width="3"/><rect x="38" y="47" width="7" height="3" rx="1.5" fill="#fff" opacity=".6"/><rect x="67" y="47" width="7" height="3" rx="1.5" fill="#fff" opacity=".6"/><path d="M50 70 Q63 75 72 65" ${st}/>`;

    case 'wow': return `<circle cx="47" cy="51" r="6.5" fill="${INK}"/><circle cx="49" cy="49" r="2.2" fill="#fff"/><circle cx="73" cy="51" r="6.5" fill="${INK}"/><circle cx="75" cy="49" r="2.2" fill="#fff"/><ellipse cx="60" cy="71" rx="5.5" ry="7" fill="${INK}"/>`;
    case 'sleepy': return `<path d="M41 53 Q47 58 53 53" ${st}/><path d="M67 53 Q73 58 79 53" ${st}/><path d="M55 70 Q60 73 65 70" ${st}/><text x="80" y="42" font-family="Arial" font-size="13" font-weight="900" fill="${INK}" opacity=".55">z</text>`;
    case 'silly': return eyes + `<path d="M46 65 Q60 75 74 65" ${st}/><path d="M56 70 Q55 81 61 81 Q67 81 66 70Z" fill="#ff6f91" stroke="${INK}" stroke-width="2.5"/>`;
    case 'smug': return `<path d="M41 50 H53" ${st}/><path d="M67 50 H79" ${st}/><ellipse cx="48" cy="54" rx="4" ry="3.5" fill="${INK}"/><ellipse cx="74" cy="54" rx="4" ry="3.5" fill="${INK}"/><path d="M50 69 Q64 72 74 63" ${st}/>`;
    case 'love': return `<path d="M47 58 l-7 -7 a4 4 0 0 1 7 -5 a4 4 0 0 1 7 5z" fill="#e35a72"/><path d="M73 58 l-7 -7 a4 4 0 0 1 7 -5 a4 4 0 0 1 7 5z" fill="#e35a72"/><path d="M46 66 Q60 78 74 66" ${st}/>`;
    default: return eyes + `<path d="M46 66 Q60 78 74 66" ${st}/>`;
  }
}

    case 'headphones': return `<path d="M26 55 Q26 12 60 12 Q94 12 94 55" stroke="#2f2a3d" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="15" y="44" width="17" height="27" rx="7" fill="#e8573f"/><rect x="88" y="44" width="17" height="27" rx="7" fill="#e8573f"/><rect x="18" y="48" width="5" height="12" rx="2.5" fill="#fff" opacity=".3"/>`;

    case 'tophat': return `<rect x="24" y="25" width="72" height="9" rx="4.5" fill="#2f2a3d"/><rect x="37" y="1" width="46" height="29" rx="5" fill="#2f2a3d"/><rect x="37" y="19" width="46" height="6" fill="#e8573f"/><rect x="41" y="4" width="6" height="14" rx="3" fill="#fff" opacity=".12"/>`;
    case 'horns': return `<path d="M33 30 Q25 12 37 4 Q37 18 47 27Z" fill="#e35a72" stroke="#9e2f46" stroke-width="2.5" stroke-linejoin="round"/><path d="M87 30 Q95 12 83 4 Q83 18 73 27Z" fill="#e35a72" stroke="#9e2f46" stroke-width="2.5" stroke-linejoin="round"/>`;
    default: return '';
  }
}
function avatarSVG(a, opt = {}) {
  a = a || {};
  const skin = SKINS[a.skin] || SKINS[0];
  const shirt = SHIRTS[a.shirt] || SHIRTS[0];
  const head = `<rect x="52" y="80" width="16" height="14" fill="${skin}"/><rect x="52" y="80" width="16" height="6" fill="#000" opacity=".12"/>
    <rect x="26" y="24" width="68" height="62" rx="16" fill="${skin}"/>
    <path d="M78 24 a16 16 0 0 1 16 16 v30 a16 16 0 0 1 -16 16 h-4 v-62z" fill="#000" opacity=".1"/>
    <rect x="34" y="30" width="22" height="8" rx="4" fill="#fff" opacity=".35"/>`;
  const body = opt.noBody ? '' : `<rect x="20" y="91" width="80" height="40" rx="14" fill="${shirt}"/><path d="M80 91 h6 a14 14 0 0 1 14 14 v26 h-20z" fill="#000" opacity=".12"/><rect x="28" y="96" width="20" height="6" rx="3" fill="#fff" opacity=".25"/>`;
  const w = opt.size ? ` width="${opt.size}" height="${opt.size}"` : '';
  return `<svg viewBox="0 0 120 120"${w} xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}${head}${faceSVG(FACES[a.face] || 'smile')}${hatSVG(HATS[a.hat] || 'none')}</svg>`;
}
const randomAvatar = () => ({ skin: rnd(SKINS.length), face: rnd(FACES.length), hat: rnd(HATS.length), shirt: rnd(SHIRTS.length) });
const ava = (a, cls = 'md') => `<div class="ava ${cls}">${avatarSVG(a)}</div>`;

(function leaves() {
  const box = $('#leaves');
  const cols = ['#e8673a', '#f4b942', '#c94f2c', '#f08a3c', '#a8582f', '#d9a441'];
  const n = window.innerWidth < 500 ? 8 : 12;
  for (let i = 0; i < n; i++) {
    const s = 14 + rnd(16);
    const el = document.createElement('div');
    el.className = 'leaf';
    el.style.left = rnd(100) + '%';
    el.style.animationDuration = (11 + rnd(10)) + 's';
    el.style.animationDelay = (-rnd(20)) + 's';
    el.style.opacity = (0.35 + Math.random() * 0.4).toFixed(2);
    el.innerHTML = `<svg width="${s}" height="${s}" viewBox="-12 -18 24 36" style="animation-duration:${2 + Math.random() * 2}s"><path d="M0 -17 C10 -10 13 0 0 15 C-13 0 -10 -10 0 -17Z" fill="${pick(cols)}"/><path d="M0 -13 V18" stroke="rgba(0,0,0,.3)" stroke-width="1.6"/></svg>`;
    box.appendChild(el);
  }
})();

/* ---------- toasts, fx, sheets ---------- */
function toast(html, ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = html;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, ms);
}

function confetti(good) {
  const items = good ? ['🍁', '🍂', '✨', '⭐', '🎉', '🧡'] : ['💨', '🍂', '😅'];
  const n = good ? 26 : 8;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = pick(items);
    $('#fx').appendChild(el);
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 200;
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 120;
    el.animate([
      { transform: 'translate(-50%,-50%) scale(.2) rotate(0)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2) rotate(${rnd(360)}deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 260}px)) scale(.9) rotate(${rnd(720)}deg)`, opacity: 0 },
    ], { duration: 1500 + rnd(700), easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => el.remove();
  }
}
function openSheet(html, onMount) {
  const sh = $('#sheet');
  sh.classList.remove('hidden', 'closing');
  const body = $('.sheet-body', sh);
  body.innerHTML = '<div class="grab"></div>' + html;
  body.scrollTop = 0;
  $('.sheet-bg', sh).onclick = closeSheet;
  if (onMount) onMount(body);
}
function closeSheet() {
  const sh = $('#sheet');
  if (sh.classList.contains('hidden')) return;
  sh.classList.add('closing');
  setTimeout(() => sh.classList.add('hidden'), 300);
}

/* ---------- музика й звуки: усе синтезується WebAudio, без файлів ---------- */
const Sound = {
  ac: null, out: null, mus: null, musIn: null, timer: null, next: 0, beat: 0,
  musicOn: store.get('music', true), sfxOn: store.get('sfx', true),
  init() {   // браузери дозволяють звук лише після дотику користувача
    if (this.ac) { if (this.ac.state === 'suspended' && !document.hidden) this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC(); } catch (e) { return; }
    this.out = this.ac.createGain(); this.out.gain.value = 0.9; this.out.connect(this.ac.destination);
    this.mus = this.ac.createGain(); this.mus.gain.value = 0; this.mus.connect(this.out);
    this.musIn = this.ac.createBiquadFilter(); this.musIn.type = 'lowpass'; this.musIn.frequency.value = 1700; this.musIn.connect(this.mus);
    const b = this.ac.createBuffer(1, 1, 22050), src = this.ac.createBufferSource();   // «розблокування» звуку на iOS
    src.buffer = b; src.connect(this.ac.destination); src.start(0);
    if (this.musicOn) this.startMusic();
  },
  note(f, t, dur, type, vol, dest) {
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.out);
    o.start(t); o.stop(t + dur + 0.05);
  },
  pad(f, t, dur, vol) {
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'triangle'; o.frequency.value = f; o.detune.value = (Math.random() - 0.5) * 10;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.8);
    g.gain.setValueAtTime(vol, t + dur - 0.5); g.gain.linearRampToValueAtTime(0, t + dur + 0.7);
    o.connect(g); g.connect(this.musIn);
    o.start(t); o.stop(t + dur + 0.8);
  },
  sfx(name) {
    if (!this.ac || !this.sfxOn || this.ac.state !== 'running') return;
    const t = this.ac.currentTime + 0.005;
    try {
      switch (name) {
        case 'click': this.note(880, t, 0.06, 'sine', 0.1); this.note(1320, t + 0.012, 0.05, 'sine', 0.05); break;
        case 'select': this.note(660, t, 0.08, 'triangle', 0.13); this.note(990, t + 0.06, 0.12, 'triangle', 0.11); break;
        case 'tick': this.note(1480, t, 0.035, 'square', 0.035); break;
        case 'good': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.note(f, t + i * 0.08, 0.4, 'triangle', 0.15)); break;
        case 'bad': this.note(392, t, 0.25, 'triangle', 0.13); this.note(311.13, t + 0.18, 0.45, 'triangle', 0.12); break;
        case 'super': [784, 988, 1175, 1568, 1976].forEach((f, i) => this.note(f, t + i * 0.055, 0.3, 'square', 0.04)); break;
        case 'win': [523.25, 659.25, 783.99, 659.25, 1046.5].forEach((f, i) => this.note(f, t + i * 0.14, 0.55, 'triangle', 0.16)); break;
        case 'join': this.note(1046.5, t, 0.5, 'sine', 0.11); this.note(1568, t + 0.1, 0.6, 'sine', 0.07); break;
      }
    } catch (e) {}
  },
  toggleMusic() {
    this.musicOn = !this.musicOn; store.set('music', this.musicOn);
    this.init();
    if (this.musicOn) this.startMusic(); else this.stopMusic();
  },
  startMusic() {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    this.mus.gain.cancelScheduledValues(t); this.mus.gain.setValueAtTime(this.mus.gain.value, t); this.mus.gain.linearRampToValueAtTime(0.55, t + 2);
    if (this.timer) return;
    this.next = t + 0.1;
    this.timer = setInterval(() => this.schedule(), 150);
  },
  stopMusic() {
    if (!this.ac) return;
    const t = this.ac.currentTime;
    this.mus.gain.cancelScheduledValues(t); this.mus.gain.setValueAtTime(this.mus.gain.value, t); this.mus.gain.linearRampToValueAtTime(0, t + 0.6);
    clearInterval(this.timer); this.timer = null;
  },
  schedule() {   // спокійний луп: Cmaj7 → Am7 → Fmaj7 → G, 80 ударів на хвилину
    if (!this.ac || this.ac.state !== 'running') return;
    const E8 = 60 / 80 / 2;
    const CH = [[261.63, 329.63, 392, 493.88], [220, 261.63, 329.63, 392], [174.61, 220, 261.63, 329.63], [196, 246.94, 293.66, 392]];
    const ARP = [0, 2, 1, 3, 2, 1, 3, 0];
    if (this.next < this.ac.currentTime) this.next = this.ac.currentTime + 0.05;
    while (this.next < this.ac.currentTime + 0.6) {
      const bar = Math.floor(this.beat / 8) % 4, ch = CH[bar], pos = this.beat % 8;
      if (pos === 0) {
        ch.slice(0, 3).forEach((f) => this.pad(f / 2, this.next, E8 * 8, 0.035));
        this.note(ch[0] / 4, this.next, E8 * 7, 'sine', 0.08, this.musIn);
      }
      if (pos % 2 === 0 || Math.random() < 0.3) this.note(ch[ARP[pos]] * (pos >= 4 ? 2 : 1), this.next, 1.1, 'sine', 0.035, this.musIn);
      this.next += E8; this.beat++;
    }
  },
};

async function shareInvite() {

    showLink(url); return;   // меню «Поділитися» не відкрилось (буває у вбудованих браузерах) — показуємо посилання

async function copyInvite() {

  else showLink(url);

async function copyText(t) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try {   // запасний спосіб для вбудованих браузерів (Telegram, Instagram)
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

        <span class="diff">${stars(q.d)}</span></div>
      ${q.super ? `<div class="super-tag">⚡ Супер-питання · очки ×${q.mult}</div>` : q.final ? '<div class="final-tag">🔥 Фінальне питання · очки ×2</div>' : ''}

        <span class="let">${LETTERS[i]}</span><span class="tx">${esc(o)}</span></button>`).join('')}</div>
      ${mine ? `<div class="locked pop">🔒 Відповідь прийнято — чекаємо на інших</div>` : ''}

function drawBoard(box, animate) {
  const q = S.q, res = (q && q.results) || {};
  const rows = S.order.map((pid) => ({ pid, score: P(pid).score, gain: res[pid] ? res[pid].pts : 0 }));
  const before = rows.slice().sort((a, b) => (b.score - b.gain) - (a.score - a.gain) || S.order.indexOf(a.pid) - S.order.indexOf(b.pid));
  const after = rows.slice().sort((a, b) => b.score - a.score || S.order.indexOf(a.pid) - S.order.indexOf(b.pid));
  const H = 52;
  box.style.height = (rows.length * H - 6) + 'px';
  box.innerHTML = rows.map((r) => {
    const oldI = before.indexOf(r), newI = after.indexOf(r);
    const x = res[r.pid];
    const picked = x && x.i != null;
    const chip = picked ? `<span class="achip ${x.ok ? 'ok' : 'no'}" style="--c:${OPT_COLORS[x.i]}">${LETTERS[x.i]} ${x.ok ? '✓' : '✗'}</span>` : '<span class="achip none">⏰</span>';
    const sub = picked ? `${esc(q.options[x.i])}${x.ok && x.ms != null ? ` · ${(x.ms / 1000).toFixed(1)} с` : ''}` : 'не встигли';
    return `<div class="brow ${r.pid === PID ? 'me' : ''} ${picked ? (x.ok ? 'r-ok' : 'r-no') : 'r-none'}" data-new="${newI}" style="top:${(animate ? oldI : newI) * H}px">
      <span class="pos">${newI + 1}</span>${ava(P(r.pid).avatar, 'xs')}
      <span class="who"><span class="nm">${r.pid === PID ? 'Ти' : nickOf(r.pid)}</span><span class="ans">${chip}<small>${sub}</small></span></span>
      <span class="score"><span class="pts" data-from="${animate ? r.score - r.gain : r.score}" data-to="${r.score}">${animate ? r.score - r.gain : r.score}</span>
        <span class="gain ${r.gain ? '' : 'zero'}">${r.gain ? '+' + r.gain : '+0'}</span></span></div>`;
  }).join('');
  if (!animate) return;
  setTimeout(() => {
    $$('.brow', box).forEach((row) => {
      row.style.top = (+row.dataset.new * H) + 'px';
      const el = $('.pts', row), from = +el.dataset.from, to = +el.dataset.to;
      if (from === to) return;
      const t0 = performance.now();
      const step = (t) => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }, 700);
}

/* --- final --- */
function buildFinal(st) {
  const ranked = S.order.slice().sort((a, b) => P(b).score - P(a).score);
  const pod = (pid, place) => pid ? `<div class="pod p${place}">${place === 1 ? '<div class="crown-big">👑</div>' : ''}${ava(P(pid).avatar, place === 1 ? 'lg' : 'md')}
      <b class="nm">${nickOf(pid)}</b><span class="sc">${P(pid).score}</span><div class="col">${place}</div></div>` : '<div class="pod"></div>';
  const hist = S.history || [];
  const fastest = [];
  hist.forEach((h) => Object.entries(h.results).forEach(([pid, r]) => { if (r.ok) fastest.push({ pid, ms: r.ms }); }));
  fastest.sort((a, b) => a.ms - b.ms);
  const acc = (pid) => { const n = hist.length || 1; return Math.round((P(pid).right || 0) / n * 100); };
  const winner = ranked[0];
  const tie = ranked.length > 1 && P(ranked[0]).score === P(ranked[1]).score;
  st.innerHTML = `
    <div class="stage-head center" style="align-items:center"><span class="tag">Гру завершено</span>
      <h2>${tie ? 'Нічия на вершині! 🤝' : `${winner === PID ? 'Ти' : nickOf(winner)} — Ерудит вечора! 🏆`}</h2></div>
    <div class="podium">${pod(ranked[1], 2)}${pod(ranked[0], 1)}${pod(ranked[2], 3)}</div>
    ${ranked[3] ? `<div class="card fourth">${ava(P(ranked[3]).avatar, 'xs')} <b>4. ${nickOf(ranked[3])}</b> <span class="muted">· ${P(ranked[3]).score}</span></div>` : ''}
    <div class="card"><div class="lbl">Нагороди</div>
      ${fastest[0] ? `<div class="award">⚡ <span>Найшвидша правильна відповідь</span><b>${nickOf(fastest[0].pid)} · ${(fastest[0].ms / 1000).toFixed(1)} с</b></div>` : ''}
      ${S.order.map((pid) => `<div class="award">${ava(P(pid).avatar, 'xs')} <span>${nickOf(pid)}</span><b>${P(pid).right || 0} з ${hist.length} · ${acc(pid)}%</b></div>`).join('')}
      ${(() => { const best = S.order.slice().sort((a, b) => (P(b).bestStreak || 0) - (P(a).bestStreak || 0))[0]; return best && (P(best).bestStreak || 0) >= 3 ? `<div class="award">🔥 <span>Найдовша серія</span><b>${nickOf(best)} · ${P(best).bestStreak}</b></div>` : ''; })()}
    </div>
    ${IS_HOST ? `<div class="sticky-act"><button class="btn" id="btnAgain">🔄 Ще одна гра</button><button class="btn ghost small" id="btnLobby">⚙️ Змінити налаштування</button></div>`
      : `<div class="status"><span class="dots"><i></i><i></i><i></i></span> ${nickOf(S.host)} може запустити ще одну гру</div>`}`;
  if (IS_HOST) {
    $('#btnAgain', st).onclick = () => dispatch({ k: 'start' });
    $('#btnLobby', st).onclick = () => dispatch({ k: 'lobby' });
  }
  const fxKey = 'fx:' + CODE;
  if (store.get(fxKey, '') !== S.game + ':final') {
    store.set(fxKey, S.game + ':final');
    setTimeout(() => { confetti(true); setTimeout(() => confetti(true), 700); }, 300);
    Sound.sfx('win');
  }
}

let lastTick = -1;
function tick() {
  requestAnimationFrame(tick);
  if (VIEW !== 'room' || !S) return;
  const now = hostNow();
  if (S.phase === 'question') {
    const q = S.q;
    const intro = $('#intro'), wrap = $('#qwrap');
    if (!intro || !wrap) return;
    const inIntro = now < q.startAt;
    intro.classList.toggle('hidden', !inIntro);
    if (wrap.classList.contains('show') === inIntro) wrap.classList.toggle('show', !inIntro);
    const total = q.endAt - q.startAt;
    const left = Math.max(0, Math.min(total, q.endAt - now));
    const bar = $('#timer i'); if (bar) bar.style.transform = `scaleX(${left / total})`;
    const secs = Math.ceil(left / 1000);
    const ts = $('#tsec');
    if (ts && ts.textContent !== String(secs)) {
      ts.textContent = secs;
      const low = secs <= 5;
      ts.classList.toggle('low', low); $('#timer').classList.toggle('low', low);
      if (low && secs > 0 && !inIntro && !q.answers[PID] && secs !== lastTick) { lastTick = secs; vibrate(10); Sound.sfx('tick'); }
    }
  } else if (S.phase === 'reveal') {
    const nb = $('#nextbar');
    if (nb && S.autoAt) nb.style.transform = `scaleX(${Math.max(0, Math.min(1, (S.autoAt - now) / REVEAL_MS))})`;
  }
}
requestAnimationFrame(tick);

/* =========================================================
   Host-side game logic (господар — єдине джерело правди)
   ========================================================= */
function newState(code) {
  return {
    app: 'erudyt', code, v: 1, game: 0, phase: 'lobby', host: PID,
    settings: { count: 10, timer: 20 },
    players: { [PID]: newPlayer(ME_PROFILE) }, order: [PID], online: [PID],
    plan: [], qi: 0, q: null, ready: {}, autoAt: 0, history: [],
  };
}
function newPlayer(p) {
  return { nick: String(p.nick || 'Гравець').slice(0, 16), avatar: p.avatar || {}, score: 0, fifty: false, streak: 0, bestStreak: 0, right: 0 };
}
function makePlan(count) {
  const used = new Set(store.get('used', []));
  const nHard = Math.round(count * 0.25), nEasy = Math.round(count * 0.4), nMed = count - nHard - nEasy;
  const picked = [];
  [[1, nEasy], [2, nMed], [3, nHard]].forEach(([d, n]) => {
    const pool = Q.map((q, i) => i).filter((i) => Q[i][0] === d);
    let fresh = pool.filter((i) => !used.has(i));
    if (fresh.length < n) { pool.forEach((i) => used.delete(i)); fresh = pool; }
    picked.push(...shuffle(fresh).slice(0, n));
  });
  // складність упереміш; першим — легке, для розминки
  const plan = shuffle(picked);
  const e = plan.findIndex((id) => Q[id][0] === 1);
  if (e > 0) [plan[0], plan[e]] = [plan[e], plan[0]];
  // намагаємось не ставити поруч дві однакові категорії
  for (let k = 0; k < 60; k++) {
    let bad = -1;
    for (let i = 1; i < plan.length; i++) if (Q[plan[i]][1] === Q[plan[i - 1]][1]) { bad = i; break; }
    if (bad < 0) break;
    const j = 1 + rnd(plan.length - 1);
    [plan[bad], plan[j]] = [plan[j], plan[bad]];
  }
  // супер-питання: складні (не перше й не останнє), очки ×2 або ×3
  const mult = plan.map(() => 1);
  const hard = plan.map((id, i) => i).filter((i) => Q[plan[i]][0] === 3 && i > 0 && i < plan.length - 1);
  shuffle(hard).slice(0, Math.max(1, Math.round(count / 7))).forEach((i) => { mult[i] = Math.random() < 0.35 ? 3 : 2; });
  plan.forEach((i) => used.add(i));
  store.set('used', Array.from(used));
  return { plan, mult };
}
function beginQuestion(s) {
  const id = s.plan[s.qi];
  const [d, cat, text, opts, fact] = Q[id];
  const order = shuffle([0, 1, 2, 3]);
  const now = Date.now();
  s.q = {
    id, d, cat, text, fact: fact || '', options: order.map((k) => opts[k]), correct: order.indexOf(0),
    startAt: now + INTRO_MS, endAt: now + INTRO_MS + s.settings.timer * 1000,
    final: s.qi === s.plan.length - 1, answers: {}, fifty: {}, results: null,
  };
  const m = (s.mult && s.mult[s.qi]) || 1;
  s.q.super = m > 1;
  s.q.mult = s.q.final ? Math.max(2, m) : m;
  s.phase = 'question'; s.ready = {}; s.autoAt = 0;
}
function closeQuestion(s) {
  const q = s.q, total = s.settings.timer * 1000;
  q.results = {};
  s.order.forEach((pid) => {
    const a = q.answers[pid], pl = s.players[pid];
    const ok = !!a && a.i === q.correct;
    const base = 100 * q.d;
    const bonus = ok ? Math.round(base * 0.5 * Math.max(0, 1 - a.ms / total)) : 0;
    const pts = ok ? (base + bonus) * (q.mult || (q.final ? 2 : 1)) : 0;
    pl.score += pts;
    pl.streak = ok ? pl.streak + 1 : 0;
    pl.bestStreak = Math.max(pl.bestStreak || 0, pl.streak);
    if (ok) pl.right = (pl.right || 0) + 1;
    q.results[pid] = { ok, pts, bonus, i: a ? a.i : null, ms: a ? a.ms : null };
  });
  s.history.push({ id: q.id, results: q.results });
  s.phase = 'reveal';
  s.autoAt = Date.now() + REVEAL_MS;
}
function advance(s) {
  if (s.qi + 1 >= s.plan.length) { s.phase = 'final'; s.q = null; return; }
  s.qi++;
  beginQuestion(s);
}
const onlineList = () => S.order.filter(isOnline);

function hostAct(pid, a) {   // повертає true, якщо стан змінився
  const s = S, pl = s.players[pid];
  if (!pl) return false;
  switch (a.k) {
    case 'settings':
      if (pid !== s.host || (s.phase !== 'lobby' && s.phase !== 'final')) return false;
      if ([10, 15, 20].includes(a.count)) s.settings.count = a.count;
      if ([15, 20, 30].includes(a.timer)) s.settings.timer = a.timer;
      return true;
    case 'start':
      if (pid !== s.host || onlineList().length < 2) return false;
      s.order = s.order.filter((p) => isOnline(p));   // хто пішов до старту — не грає
      s.order.forEach((p) => { Object.assign(s.players[p], { score: 0, fifty: false, streak: 0, bestStreak: 0, right: 0 }); });
      s.game++; const mp = makePlan(s.settings.count); s.plan = mp.plan; s.mult = mp.mult; s.qi = 0; s.history = [];
      beginQuestion(s);
      return true;
    case 'lobby':
      if (pid !== s.host) return false;
      s.phase = 'lobby'; s.q = null;
      return true;
    case 'answer': {
      if (s.phase !== 'question' || s.q.answers[pid]) return false;
      const now = Date.now();
      if (now < s.q.startAt - 500 || now > s.q.endAt + 1500) return false;
      if (!(a.i >= 0 && a.i < 4)) return false;
      const total = s.settings.timer * 1000;
      const ms = now > s.q.endAt ? total : Math.min(total, Math.max(0, +a.ms || 0));
      s.q.answers[pid] = { i: a.i, ms };
      if (onlineList().every((p) => s.q.answers[p])) { const qi = s.qi; setTimeout(() => { if (S.phase === 'question' && S.qi === qi) { closeQuestion(S); commit(); } }, 700); }
      return true;
    }
    case 'fifty': {
      if (s.phase !== 'question' || pl.fifty || s.q.answers[pid]) return false;
      const wrong = shuffle([0, 1, 2, 3].filter((i) => i !== s.q.correct)).slice(0, 2);
      s.q.fifty[pid] = wrong; pl.fifty = true;
      return true;
    }
    case 'ready':
      if (s.phase !== 'reveal' || s.ready[pid]) return false;
      s.ready[pid] = true;
      if (onlineList().every((p) => s.ready[p])) advance(s);
      return true;
    case 'end':
      if (pid !== s.host || (s.phase !== 'question' && s.phase !== 'reveal')) return false;
      s.phase = 'final'; s.q = null;
      return true;
    case 'profile':
      pl.nick = String(a.nick || '').slice(0, 16) || pl.nick;
      pl.avatar = a.avatar || pl.avatar;
      return true;
  }
  return false;
}
let hostTimer = null;
function scheduleHost() {
  clearTimeout(hostTimer);
  if (!IS_HOST || !S) return;
  let at = 0, fn = null;
  if (S.phase === 'question') { at = S.q.endAt + 400; fn = () => closeQuestion(S); }
  else if (S.phase === 'reveal') { at = S.autoAt; fn = () => advance(S); }
  if (!fn) return;
  const ph = S.phase, qi = S.qi;
  hostTimer = setTimeout(() => { if (S && S.phase === ph && S.qi === qi) { fn(); commit(); } }, Math.max(0, at - Date.now()));
}
function setOnline() {   // господар: хто зараз на зв’язку
  const list = [PID, ...Array.from(Net.conns.keys())];
  const changed = list.length !== (S.online || []).length || list.some((p) => !S.online.includes(p));
  S.online = list;
  return changed;
}

function dispatch(a) {
  if (!S) return false;
  if (IS_HOST) { if (hostAct(PID, a)) commit(); return true; }
  if (!Net.conn) { toast('Немає зв’язку… зачекай секунду 🔌'); return false; }
  Net.send({ t: 'act', a });
  return true;
}
function persist() {
  if (!S) return;
  store.set('state:' + CODE, S);
  store.set('lastRoom', { hash: location.hash, code: CODE });
}
function commit() {   // тільки господар
  S.v++;
  persist();
  Net.broadcast({ t: 'state', s: S });
  scheduleHost();
  render();
}

/* =========================================================
   Network — через relay.js (публічні MQTT-брокери, шифрування ключем кімнати).
   Господар тримає стан; гості шлють йому дії, він розсилає стан усім.
   ========================================================= */
const Net = {
  relay: null, linked: false, conns: new Map(),   // господар: pid → коли востаннє чули
  lastSeen: 0, visibleAt: 0, upAt: 0, offset: 0, bestRtt: Infinity,
  hostAway: false, diag: { server: false, found: false }, since: 0, full: false, status: 'Підключаємося до сервера гри…', hb: null,
  get conn() { return this.linked; },
  ready() { return !!(this.relay && this.relay.up); },
  send(m) { if (this.relay) this.relay.send('host', m); },
  sendTo(pid, m) { if (this.relay) this.relay.send(pid, m); },
  broadcast(m, except) { if (this.relay) this.relay.send('*', m, except); },

  start() {
    this.stop();
    this.linked = false; this.lastSeen = 0; this.upAt = 0; this.hostAway = false; this.bestRtt = Infinity;
    this.diag = { server: false, found: false };
    this.status = 'Підключаємося до сервера гри…';
    this.relay = new Relay({ app: 'erudyt', code: CODE, me: IS_HOST ? 'host' : PID, onMessage: (f, m) => this.receive(f, m), onStatus: (up) => this.onStatus(up) });
    this.relay.start();
    this.hb = setInterval(() => this.heartbeat(), 2500);
  },
  stop() {
    clearInterval(this.hb);
    if (this.relay) this.relay.stop();
    this.relay = null; this.linked = false; this.conns.clear();
  },
  onStatus(up) {
    this.diag.server = up > 0;
    if (up) {
      this.upAt = this.upAt || Date.now();
      this.status = IS_HOST || this.linked ? 'Онлайн' : 'Сервер на зв’язку — шукаємо гру…';
      if (IS_HOST) this.broadcast({ t: 'hostup' }); else if (!this.linked) this.hello();
    } else {
      this.upAt = 0;
      this.status = 'Підключаємося до сервера гри…';
    }
    render();
  },
  hello() { if (!this.full) this.send({ t: 'hello', pid: PID, profile: ME_PROFILE }); },
  receive(from, m) {
    if (!m || typeof m !== 'object') return;
    if (IS_HOST) {
      if (from === 'host') return;
      if (m.t === 'hello') { this.onHello(from, m); return; }
      if (!this.conns.has(from)) { this.sendTo(from, { t: 'who' }); return; }
      this.conns.set(from, Date.now());
      if (m.t === 'ping') { this.sendTo(from, { t: 'pong', c: m.c, h: Date.now() }); return; }
      onHostMessage(from, m);
      return;
    }
    if (from !== 'host') return;
    this.lastSeen = Date.now();
    if (m.t === 'who' || m.t === 'hostup') { this.hello(); return; }
    if (!this.linked && m.t !== 'full') {
      this.linked = true; this.hostAway = false; this.diag.found = true; this.status = 'Онлайн';
      this.send({ t: 'ping', c: Date.now() });
      render();
    }
    onGuestMessage(m);
  },

  /* --- host side --- */
  dropGuest(pid) {
    if (!this.conns.delete(pid)) return;
    if (S && setOnline()) {
      if (S.phase === 'question' && onlineList().every((p) => S.q.answers[p])) closeQuestion(S);
      else if (S.phase === 'reveal' && onlineList().every((p) => S.ready[p])) advance(S);
      commit();
    }
  },
  onHello(pid, d) {
    pid = String(pid || '').slice(0, 24);
    if (!pid || pid === PID || !d.profile) return;
    const known = !!S.players[pid];
    if (!known && S.order.length >= MAX_PLAYERS) {
      // місце звільняємо лише за рахунок гравця, якого немає онлайн і хто ще не грав
      const freeable = S.phase === 'lobby' ? S.order.find((p) => p !== S.host && !isOnline(p)) : null;
      if (!freeable) { this.sendTo(pid, { t: 'full' }); return; }
      S.order = S.order.filter((p) => p !== freeable); delete S.players[freeable];
    }
    const wasHere = this.conns.has(pid);
    this.conns.set(pid, Date.now());
    if (!known) { S.players[pid] = newPlayer(d.profile); S.order.push(pid); }
    else { S.players[pid].nick = String(d.profile.nick || S.players[pid].nick).slice(0, 16); S.players[pid].avatar = d.profile.avatar || S.players[pid].avatar; }
    setOnline();
    commit();
    if (!wasHere) Sound.sfx('join');
    if (!wasHere) toast(known ? `${esc(S.players[pid].nick)} повертається 👋` : `${esc(S.players[pid].nick)} у грі! 🎉`);
  },

  heartbeat() {
    if (!this.ready()) return;
    const now = Date.now();
    if (IS_HOST) {
      Array.from(this.conns).forEach(([pid, t]) => { if (now - Math.max(t, this.visibleAt) > 12000) this.dropGuest(pid); });
      return;
    }
    if (this.linked && now - Math.max(this.lastSeen, this.visibleAt) > 10000) {
      this.linked = false; this.status = 'Сервер на зв’язку — шукаємо гру…'; render();
    }
    if (!this.linked) {
      this.hello();
      const away = !!this.upAt && now - this.upAt > 7000;
      if (away !== this.hostAway) { this.hostAway = away; render(); }
    } else this.send({ t: 'ping', c: now });
  },
  wake() {   // сторінка знову видима (iOS заморожує фонові вкладки)
    this.visibleAt = Date.now();
    if (!this.relay) return;
    this.relay.wake();
    if (IS_HOST) { scheduleHost(); this.broadcast({ t: 'hostup' }); return; }
    if (this.linked) this.send({ t: 'ping', c: Date.now() }); else this.hello();
  },
};

function onHostMessage(pid, m) {
  switch (m.t) {
    case 'act':
      if (hostAct(pid, m.a || {})) commit();
      else Net.sendTo(pid, { t: 'state', s: S });
      return;
    case 'emoji':
      if (!REACTIONS.includes(m.e)) return;
      floatEmoji(m.e, pid);
      Net.broadcast({ t: 'emoji', e: m.e, pid }, pid);
      return;
  }
}
function onGuestMessage(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'pong': {
      const now = Date.now(), rtt = now - m.c;
      if (rtt >= 0 && rtt <= Net.bestRtt * 1.5 + 30) { Net.offset = m.h + rtt / 2 - now; Net.bestRtt = Math.min(Net.bestRtt, rtt); }
      return;
    }
    case 'state':
      if (!m.s || m.s.code !== CODE) return;
      {
        const was = S;
        S = m.s; persist();
        if (!was || !was.players[PID]) toast('Ти в грі! 🦉');
        render();
      }
      return;
    case 'emoji':
      if (REACTIONS.includes(m.e)) { floatEmoji(m.e, m.pid); vibrate(20); }
      return;
    case 'full':
      Net.full = true; render();
      return;
  }
}

/* =========================================================
   Flow
   ========================================================= */
function render() {
  if (!CODE) return;
  if (!S || (!IS_HOST && !S.players[PID])) renderConnect();
  else renderRoom();
}
function createRoom() {
  CODE = randomCode();
  IS_HOST = true;
  HOST_NICK = ME_PROFILE.nick;
  store.set('hosted:' + CODE, true);
  S = newState(CODE);
  history.replaceState(null, '', '#r=' + CODE + '&n=' + encodeURIComponent(ME_PROFILE.nick));
  persist();
  enterRoom();
}
function enterRoom() {
  VIEW = null; lastStageKey = null; Net.full = false; Net.hostAway = false;
  if (IS_HOST) {
    if (!S) S = newState(CODE);
    if (!S.players[PID]) { S.players[PID] = newPlayer(ME_PROFILE); S.order.unshift(PID); }
    S.host = PID;
    S.players[PID].nick = ME_PROFILE.nick; S.players[PID].avatar = ME_PROFILE.avatar;
    S.online = [PID];
    scheduleHost();
  }
  render();
  Net.start();
}
function leaveRoom() {
  Net.stop();
  clearTimeout(hostTimer);
  CODE = null; S = null; IS_HOST = false; HOST_NICK = '';
  history.replaceState(null, '', location.pathname + location.search);
  VIEW = null;
  renderHome();
}
function parseHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  return { code: (p.get('r') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 16), nick: (p.get('n') || '').slice(0, 16) };
}
function boot() {
  Net.stop();
  clearTimeout(hostTimer);
  VIEW = null;
  const { code, nick } = parseHash();
  if (!code) { CODE = null; S = null; renderHome(); return; }
  CODE = code; HOST_NICK = nick;
  IS_HOST = !!store.get('hosted:' + code, false);
  S = store.get('state:' + code, null);
  if (S && S.code !== code) S = null;
  if (ME_PROFILE && (IS_HOST || S)) enterRoom();
  else renderHome();
}
window.addEventListener('hashchange', boot);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CODE) Net.wake(); });
window.addEventListener('pageshow', (e) => { if (e.persisted && CODE) Net.wake(); });

if (typeof mqtt === 'undefined' || typeof Relay === 'undefined' || !window.crypto || !crypto.subtle) {
  document.getElementById('app').innerHTML = '<div class="card wait"><h2>Не вдалося завантажити гру 😕</h2><p class="muted">Перевір інтернет і онови сторінку.</p></div>';
} else {
  boot();
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {}); });
}

</script>
