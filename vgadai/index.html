<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вгадай мене</title>
<meta name="description" content="Гра на двох: загадуй факти про себе й вгадуй факти про друга.">
<meta name="theme-color" content="#1d1530">
<meta property="og:title" content="Вгадай мене 🍂">
<meta property="og:description" content="Заходь — пограємо у факти одне про одного!">
<meta property="og:image" content="https://cluckh.github.io/destiny/vgadai/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вгадай мене">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1d1530; --panel:#2d2142; --panel-2:#3a2a52; --line:#4b3866; --shadow:#150e22;
  --cream:#fff2de; --muted:#c4afc7; --ink:#2a1608;
  --pumpkin:#f08a3c; --pumpkin-d:#b5591c;
  --mustard:#f4b942; --mustard-d:#b78220;
  --sage:#93b977; --sage-d:#5d7f46;
  --berry:#e35a72; --berry-d:#9e2f46;
  --sky:#7fb7d9; --sky-d:#45799c;
  --spring:cubic-bezier(.3,1.55,.55,1);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100dvh;background:var(--night);color:var(--cream);
  font-family:'Nunito',system-ui,-apple-system,sans-serif;font-weight:700;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
h1,h2,h3,.disp{font-family:'Unbounded',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.hidden{display:none!important}
.muted{color:var(--muted);font-weight:600}
.center{text-align:center}

/* ---------- evening sky ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(130% 55% at 50% 112%, #d0602e 0%, #9a4126 20%, rgba(106,44,51,0) 58%),
    linear-gradient(180deg,#191330 0%,#2a1a3f 42%,#46223f 72%,#652b35 100%);}
.stars{position:absolute;inset:0 0 40% 0;opacity:.75;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%,#fff 50%,transparent 51%),
    radial-gradient(1.2px 1.2px at 28% 8%,#ffe9c7 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 44% 26%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 61% 12%,#fff 50%,transparent 51%),
    radial-gradient(1.8px 1.8px at 72% 30%,#ffe9c7 50%,transparent 51%),
    radial-gradient(1.2px 1.2px at 90% 16%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 6% 40%,#fff 50%,transparent 51%),
    radial-gradient(1.3px 1.3px at 36% 44%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 82% 48%,#ffe9c7 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 54% 38%,#fff 50%,transparent 51%);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:.9}}
.moon{position:absolute;top:7%;right:9%;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fff6e4,#f6d9a8 60%,#e9bd7c);
  box-shadow:0 0 40px 12px rgba(255,214,150,.22),0 0 120px 40px rgba(255,170,90,.12)}
.moon::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(200,150,90,.25);top:22px;left:40px;box-shadow:-18px 18px 0 -3px rgba(200,150,90,.2)}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh}
.leaves{position:absolute;inset:0}
.leaf{position:absolute;top:-40px;will-change:transform;animation:fall linear infinite}
.leaf svg{display:block;animation:sway ease-in-out infinite alternate}
@keyframes fall{to{transform:translateY(112vh)}}
@keyframes sway{from{transform:translateX(-22px) rotate(-35deg)}to{transform:translateX(22px) rotate(40deg)}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.screen{display:flex;flex-direction:column;gap:16px}
.enter>*{animation:rise .55s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}
.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}
.enter>*:nth-child(6){animation-delay:.3s}.enter>*:nth-child(7){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}60%{opacity:1;transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes wiggle{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-6px) rotate(-12deg)}}
.pop{animation:pop .6s var(--spring) both}
.bob{animation:bob 2.6s ease-in-out infinite}
.shake{animation:shake .5s ease both}

/* ---------- blocks ---------- */
.card{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:0 7px 0 var(--shadow),0 18px 34px rgba(0,0,0,.35)}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
input[type=text],textarea{width:100%;border:3px solid var(--line);background:#231936;border-radius:14px;
  padding:13px 14px;font-size:17px;font-weight:800;outline:none;transition:border-color .2s,box-shadow .2s;color:var(--cream)}
textarea{resize:none;min-height:88px;line-height:1.35}
input::placeholder,textarea::placeholder{color:#8d7896;font-weight:700}
input:focus,textarea:focus{border-color:var(--pumpkin);box-shadow:0 0 0 4px rgba(240,138,60,.2)}

.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em;
  border:0;border-radius:18px;padding:17px 20px;color:var(--ink);
  --b:var(--pumpkin);--bd:var(--pumpkin-d);background:var(--b);
  box-shadow:0 6px 0 var(--bd),0 12px 20px rgba(0,0,0,.35);
  transition:transform .14s var(--spring),box-shadow .14s,filter .2s,opacity .2s}
.btn::before{content:'';position:absolute;left:12px;right:12px;top:6px;height:9px;border-radius:9px;background:rgba(255,255,255,.3);pointer-events:none}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--bd),0 4px 8px rgba(0,0,0,.3)}
.btn:disabled{filter:grayscale(.7) brightness(.75);cursor:default}
.btn.mustard{--b:var(--mustard);--bd:var(--mustard-d)}
.btn.sage{--b:var(--sage);--bd:var(--sage-d)}
.btn.blue{--b:var(--sky);--bd:var(--sky-d)}
.btn.ghost{--b:var(--panel-2);--bd:var(--shadow);color:var(--cream)}
.btn.ghost::before{background:rgba(255,255,255,.07)}
.btn.small{font-size:14px;padding:12px 14px;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.chip{border:0;border-radius:999px;padding:9px 14px;background:var(--panel-2);font-weight:800;font-size:14px;
  box-shadow:0 4px 0 var(--shadow);transition:transform .14s var(--spring),box-shadow .14s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.tag{display:inline-block;font-family:'Unbounded';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  background:rgba(244,185,66,.16);color:var(--mustard);padding:6px 10px;border-radius:999px}

/* ---------- avatar ---------- */
.ava{flex:none;border-radius:22%;background:radial-gradient(circle at 50% 30%,#4a3866,#2b1f40);overflow:hidden;
  border:3px solid var(--line);box-shadow:0 5px 0 var(--shadow)}
.ava svg{display:block;width:100%;height:100%}
.ava.xs{width:34px;height:34px;border-width:2px;box-shadow:0 3px 0 var(--shadow)}
.ava.sm{width:46px;height:46px}
.ava.md{width:64px;height:64px}
.ava.lg{width:96px;height:96px}
.ava.xl{width:124px;height:124px;border-radius:28px}

/* ---------- home ---------- */
.logo{text-align:center;padding:14px 0 2px}
.logo-badge{width:66px;height:66px;margin:0 auto 12px;display:grid;place-items:center;font-size:36px;border-radius:20px;
  background:var(--mustard);box-shadow:0 6px 0 var(--mustard-d),0 14px 26px rgba(0,0,0,.35);transform:rotate(-8deg);animation:bob 3.2s ease-in-out infinite}
.logo h1{font-size:40px;font-weight:800;line-height:.98;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.logo h1 span{color:var(--pumpkin);display:inline-block;transform:rotate(-3deg)}
.logo p{margin:12px auto 0;max-width:300px}
.invite{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#5a2c4a,#3a2552);border-color:#7a4466}
.invite .ico{font-size:30px;animation:wiggle 1.6s ease-in-out infinite}

.ed-top{display:flex;gap:16px;align-items:center}
.ed-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.ed-side .chip{align-self:flex-start}
.tabs{display:flex;gap:6px;margin:18px 0 12px;background:#231936;padding:5px;border-radius:16px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:800;color:var(--muted);transition:background .25s var(--ease),color .25s}
.tabs button.on{background:var(--panel-2);color:var(--cream);box-shadow:0 3px 0 var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.grid button{aspect-ratio:1;border:3px solid transparent;border-radius:16px;background:#231936;padding:3px;transition:transform .2s var(--spring),border-color .2s}
.grid button svg{width:100%;height:100%;display:block}
.grid button.on{border-color:var(--pumpkin);transform:scale(1.06);background:#3b2850}
.grid button:active{transform:scale(.92)}
.swatch{display:block;width:100%;height:100%;border-radius:11px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.25)}
.ava-pop{animation:pop .45s var(--spring)}

/* ---------- lobby ---------- */
.versus{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:8px 0}
.versus .slot{display:flex;flex-direction:column;align-items:center;gap:10px;width:42%}
.versus .slot b{font-family:'Unbounded';font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.versus .vs{font-family:'Unbounded';font-weight:800;color:var(--mustard);font-size:20px;transform:rotate(-8deg)}
.empty-slot{width:96px;height:96px;border-radius:22%;border:3px dashed #6b5590;display:grid;place-items:center;font-family:'Unbounded';font-size:34px;color:#8e78b2;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.status{display:flex;align-items:center;gap:10px;justify-content:center;font-size:14px;color:var(--muted);font-weight:700}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--pumpkin);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.linkbox{font-size:13px;color:var(--muted);background:#231936;border-radius:12px;padding:10px 12px;word-break:break-all;font-weight:700}
.linkbox.sel{-webkit-user-select:all;user-select:all;-webkit-touch-callout:default;font-size:14px;color:var(--cream);cursor:text}

/* ---------- game top ---------- */
.top{display:flex;align-items:center;gap:8px}
.pl{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:7px 10px 7px 7px;box-shadow:0 5px 0 var(--shadow);position:relative;transition:border-color .3s}
.pl.right{flex-direction:row-reverse;padding:7px 7px 7px 10px;text-align:right}
.pl.turn{border-color:var(--mustard)}
.pl .meta{min-width:0;flex:1}
.pl .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-family:'Unbounded';font-weight:800;font-size:19px;line-height:1.1;display:inline-block}
.pl .sc.bump{animation:pop .55s var(--spring)}
.pl .dot{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:#7c6a86;border:3px solid var(--night)}
.pl:not(.right) .dot{left:-4px}.pl.right .dot{right:-4px}
.pl .dot.on{background:#7ee08a;box-shadow:0 0 10px #7ee08a}
.pl .role{position:absolute;bottom:-9px;font-size:15px}
.pl:not(.right) .role{left:34px}.pl.right .role{right:34px}
.menu-btn{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--panel-2);box-shadow:0 5px 0 var(--shadow);font-size:20px;font-weight:900}
.banner{border-radius:14px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;background:rgba(227,90,114,.18);border:2px solid rgba(227,90,114,.4);animation:rise .4s var(--ease)}

/* ---------- stage ---------- */
#stage{display:flex;flex-direction:column;gap:16px}
.stage-head{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.stage-head h2{font-size:26px;font-weight:800;line-height:1.1}
.stage-head p{margin:0}
.qcard{display:flex;gap:14px;align-items:flex-start}
.qcard .who{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:3px}
.qtext{font-family:'Unbounded';font-weight:600;font-size:19px;line-height:1.3;word-wrap:break-word;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{--c:var(--pumpkin);position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-radius:18px;border:3px solid transparent;background:var(--panel-2);
  box-shadow:0 5px 0 var(--shadow);font-weight:800;font-size:17px;line-height:1.25;
  transition:transform .3s var(--spring),background .25s,border-color .25s,box-shadow .2s,opacity .3s}
.opt .let{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-family:'Unbounded';font-size:15px;
  background:var(--c);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt:active:not(:disabled){transform:scale(.97)}
.opt.sel{border-color:var(--c);transform:scale(1.03);background:#4a3466}
.opt.right{background:var(--sage);color:var(--ink);border-color:#c8e6b0}
.opt.right .let{background:#fff2de}
.opt.wrong{background:var(--berry);color:var(--ink)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.opt .badge{font-size:12px;font-weight:900;padding:4px 8px;border-radius:999px;background:rgba(147,185,119,.22);color:var(--sage);white-space:nowrap}
.opt.right .badge{background:rgba(42,22,8,.15);color:var(--ink)}
.finger{position:absolute;right:-6px;top:50%;font-size:30px;margin-top:-20px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring);pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.opt.sel .finger{opacity:1;transform:scale(1);animation:wiggle .9s ease-in-out infinite}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.seg button{border:3px solid transparent;border-radius:16px;background:#231936;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;
  box-shadow:0 4px 0 var(--shadow);transition:transform .25s var(--spring),border-color .2s,background .2s}
.seg button .e{font-size:24px}
.seg button b{font-family:'Unbounded';font-size:17px}
.seg button small{font-size:12px;color:var(--muted);font-weight:800}
.seg button.on{border-color:var(--mustard);background:#3f2c4f;transform:translateY(-3px)}

.optedit{--c:var(--pumpkin);display:flex;gap:9px;align-items:center;margin-bottom:10px;animation:rise .35s var(--ease) both}
.optedit .mark{width:46px;height:46px;flex:none;border-radius:14px;border:3px solid var(--c);background:transparent;display:grid;place-items:center;
  font-family:'Unbounded';font-size:15px;color:var(--c);transition:transform .25s var(--spring),background .2s,color .2s}
.optedit.ok .mark{background:var(--sage);border-color:var(--sage);color:var(--ink);transform:rotate(-8deg) scale(1.05)}
.optedit input{flex:1;min-width:0}
.optedit .rm{width:34px;height:34px;flex:none;border-radius:10px;border:0;background:transparent;color:#8d7896;font-size:18px}
.hint{font-size:13px;color:var(--muted);margin:2px 0 12px}
.err{color:#ff9aa9;font-size:14px;font-weight:800;min-height:20px;text-align:center;margin-top:-6px}

.wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 18px}
.wait h2{font-size:21px;line-height:1.2}
.typing{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--mustard);min-height:24px;transition:opacity .25s}
.typing.off{opacity:0}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

.result{text-align:center;border-radius:24px;padding:20px 16px;color:var(--ink);box-shadow:0 7px 0 var(--sage-d),0 18px 30px rgba(0,0,0,.35);background:var(--sage)}
.result.bad{background:var(--berry);box-shadow:0 7px 0 var(--berry-d),0 18px 30px rgba(0,0,0,.35)}
.result .big{font-family:'Unbounded';font-weight:800;font-size:30px;line-height:1.05}
.result .delta{font-family:'Unbounded';font-weight:800;font-size:22px;margin-top:6px}
.result .sub{font-weight:800;margin-top:6px;font-size:15px;opacity:.85}
.story-text{font-size:17px;font-weight:700;font-style:italic;min-height:24px;overflow-wrap:anywhere}
.story-text.empty{color:#8d7896;font-style:normal}

.mirror-banner{font-family:'Unbounded';font-weight:800;font-size:22px;text-align:center;padding:14px;border-radius:20px;
  background:linear-gradient(135deg,#7fb7d9,#b8a1f2);color:var(--ink);box-shadow:0 6px 0 #4d5f9c,0 14px 26px rgba(0,0,0,.35)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .card{padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.duo .nm{font-family:'Unbounded';font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duo .k{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.duo .v{font-weight:900;font-size:15px}
.pill{display:inline-block;font-family:'Unbounded';font-size:13px;padding:5px 10px;border-radius:999px;background:var(--sage);color:var(--ink)}
.pill.no{background:var(--berry)}
.meter{height:16px;border-radius:999px;background:#231936;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pumpkin),var(--mustard));transition:width 1.2s var(--ease)}
.donecheck{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.donecheck span{display:inline-flex;align-items:center;gap:7px;background:#231936;border-radius:999px;padding:5px 12px 5px 5px;font-size:14px}

/* reactions */
.react{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:5;display:flex;gap:4px;
  background:rgba(45,33,66,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 6px 0 var(--shadow)}
.react button{width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:24px;transition:transform .2s var(--spring)}
.react button:active{transform:scale(1.35)}
.react .chat-btn{position:relative;background:rgba(240,138,60,.18)}

function avatarSVG(a, opt = {}) {
  a = a || {};
  const skin = SKINS[a.skin] || SKINS[0];
  const shirt = SHIRTS[a.shirt] || SHIRTS[0];
  const head = `<rect x="52" y="80" width="16" height="14" fill="${skin}"/><rect x="52" y="80" width="16" height="6" fill="#000" opacity=".12"/>
    <rect x="26" y="24" width="68" height="62" rx="16" fill="${skin}"/>

    <rect x="34" y="30" width="22" height="8" rx="4" fill="#fff" opacity=".35"/>`;
  const body = opt.noBody ? '' : `<rect x="20" y="91" width="80" height="40" rx="14" fill="${shirt}"/><path d="M80 91 h6 a14 14 0 0 1 14 14 v26 h-20z" fill="#000" opacity=".12"/><rect x="28" y="96" width="20" height="6" rx="3" fill="#fff" opacity=".25"/>`;
  const w = opt.size ? ` width="${opt.size}" height="${opt.size}"` : '';
  return `<svg viewBox="0 0 120 120"${w} xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${body}${head}${faceSVG(FACES[a.face] || 'smile')}${hatSVG(HATS[a.hat] || 'none')}</svg>`;
}

function toast(html, ms = 2600) {

function floatEmoji(e, mine) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = e;
  const x = mine ? 55 + rnd(30) : 15 + rnd(30);

  el.animate([
    { transform: 'translate(-50%,0) scale(.4)', opacity: 0 },
    { transform: `translate(calc(-50% + ${drift * 0.3}px),-90px) scale(1.25)`, opacity: 1, offset: 0.2 },
    { transform: `translate(calc(-50% + ${drift}px),-420px) scale(1)`, opacity: 0 },
  ], { duration: 2200, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => el.remove();
}
function confetti(good) {
  const items = good ? ['🍁', '🍂', '✨', '⭐', '🎉', '🧡'] : ['💨', '🍂', '😅'];
  const n = good ? 26 : 8;

    el.animate([
      { transform: 'translate(-50%,-50%) scale(.2) rotate(0)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.2) rotate(${rnd(360)}deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 260}px)) scale(.9) rotate(${rnd(720)}deg)`, opacity: 0 },
    ], { duration: 1500 + rnd(700), easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => el.remove();
  }
}

function mountEditor(root, profile, onChange) {
  const p = { nick: profile.nick || '', avatar: Object.assign(randomAvatar(), profile.avatar || {}) };
  let tab = 'face';
  root.innerHTML = `
    <div class="ed-top">
      <div class="ava xl" id="edAva"></div>
      <div class="ed-side">
        <label class="lbl" for="edNick">Твій нік</label>
        <input type="text" id="edNick" maxlength="16" autocomplete="off" placeholder="${esc(pick(NICKS))}">
        <button class="chip" id="edRand" type="button">🎲 Навмання</button>
      </div>
    </div>
    <div class="tabs" id="edTabs">
      <button data-t="face" class="on" type="button">Обличчя</button><button data-t="hat" type="button">Шапка</button>
      <button data-t="skin" type="button">Колір</button><button data-t="shirt" type="button">Одяг</button>
    </div>
    <div class="grid" id="edGrid"></div>`;
  const nick = $('#edNick', root);
  nick.value = p.nick;
  const avaEl = $('#edAva', root);
  const drawAva = (animate) => {
    avaEl.innerHTML = avatarSVG(p.avatar);
    if (animate) { avaEl.classList.remove('ava-pop'); void avaEl.offsetWidth; avaEl.classList.add('ava-pop'); }
  };
  const drawGrid = () => {
    const list = { face: FACES, hat: HATS, skin: SKINS, shirt: SHIRTS }[tab];
    $('#edGrid', root).innerHTML = list.map((_, i) => {
      let inner;
      if (tab === 'skin' || tab === 'shirt') inner = `<span class="swatch" style="background:${list[i]}"></span>`;
      else inner = avatarSVG(Object.assign({}, p.avatar, { [tab]: i }), { noBody: true });
      return `<button type="button" data-i="${i}" class="${p.avatar[tab] === i ? 'on' : ''}" aria-label="${tab} ${i + 1}">${inner}</button>`;
    }).join('');
  };
  const changed = () => { onChange && onChange(get()); };
  $('#edTabs', root).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.t;
    $$('#edTabs button', root).forEach((x) => x.classList.toggle('on', x === b));
    drawGrid();
  });
  $('#edGrid', root).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    p.avatar[tab] = +b.dataset.i;
    $$('#edGrid button', root).forEach((x) => x.classList.toggle('on', x === b));
    drawAva(true); changed();
  });
  $('#edRand', root).addEventListener('click', () => {
    p.avatar = randomAvatar();
    if (!nick.value.trim()) nick.placeholder = pick(NICKS);
    drawAva(true); drawGrid(); changed();
  });
  nick.addEventListener('input', changed);
  const get = () => ({ nick: (nick.value.trim() || nick.placeholder).slice(0, 16), avatar: clone(p.avatar) });
  drawAva(false); drawGrid();
  return get;
}

function lobby() {

const isHostNow = () => ROLE === 'A';
const roomInfo = () => ({ c: CODE, n: S.players.A.nick, a: S.players.A.avatar, ph: S.phase, p: S.players.B ? 2 : 1, m: 2, o: S.phase === 'lobby' });
function roomStatus(i) { return i.ph === 'lobby' ? 'чекає гравців' : (i.ph === 'final' || i.ph === 'over') ? 'між партіями' : 'гра йде'; }
const isMine = (c) => !!store.get('hosted:' + c, false) || !!store.get('state:' + c, null);
function renderRooms() {
  const box = $('#roomsBox'); if (!box || CODE) return;
  const L = lobby(), list = L ? L.list(APP) : [];
  const last = store.get('lastRoom', null);
  const back = last && last.code && isMine(last.code) && !list.some((r) => r.info.c === last.code)

function joinRoom(code, nick) { JOIN_NOW = code; location.hash = '#r=' + code + '&n=' + encodeURIComponent(nick || ''); }
function announceRoom(force) {   // господар оголошує свою кімнату в списку
  if (!CODE || !S || !isHostNow()) return;
  const L = lobby(); if (!L) return;
  const now = Date.now();
  if (!force && now - annLast < 1500) { clearTimeout(annPending); annPending = setTimeout(() => announceRoom(true), 1600); return; }
  annLast = now;
  const info = roomInfo();
  L.whenUp(() => L.announce(APP, info));
}
function startAnnounce() {
  clearInterval(annTimer);
  if (!isHostNow()) return;
  announceRoom(true);
  annTimer = setInterval(() => announceRoom(true), 8000);
}
function stopAnnounce() {
  clearInterval(annTimer); clearTimeout(annPending);
  if (LOBBY && CODE && isHostNow()) LOBBY.clear(APP, CODE);
}

window.addEventListener('pagehide', () => { if (LOBBY && CODE && S && isHostNow()) LOBBY.clearSync(APP, CODE); });   // закрили вкладку — прибираємо кімнату зі списку

function inviteURL() {
  return location.origin + location.pathname + location.search + '#r=' + CODE + '&n=' + encodeURIComponent(ME_PROFILE.nick);
}
async function shareInvite() {
  const url = inviteURL();
  const text = `${ME_PROFILE.nick} кличе тебе пограти у «Вгадай мене» 🍂`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Вгадай мене', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    showLink(url); return;   // меню «Поділитися» не відкрилось (буває у вбудованих браузерах) — показуємо посилання
  }
  copyInvite();
}
async function copyInvite() {
  const url = inviteURL();
  if (await copyText(url)) toast('Посилання скопійовано 📋 — встав його в месенджер');
  else showLink(url);
}
async function copyText(t) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
  try {   // запасний спосіб для вбудованих браузерів (Telegram, Instagram)
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
function showLink(url) {
  openSheet(`<h3>🔗 Посилання на гру</h3>
    <p class="muted" style="margin:0">Затисни посилання → «Скопіювати» й встав його в месенджер.</p>

    <button class="btn ghost small" id="lkClose" type="button">Закрити</button>`, (b) => {
    $('#lkCopy', b).onclick = async () => { if (await copyText(url)) { closeSheet(); toast('Посилання скопійовано 📋'); } else toast('Затисни посилання вище й вибери «Скопіювати»'); };
    $('#lkClose', b).onclick = closeSheet;
  });
}

function renderLobby() {
  const first = show('lobby');
  const el = $('#scr-lobby');
  if (first) {
    el.className = 'screen enter';
    el.innerHTML = `
      <div class="stage-head"><span class="tag">Кімната готова</span><h2>Клич друга 💌</h2>
        <p class="muted">Надішли посилання — щойно воно відкриється, гра почнеться сама.</p></div>
      <div class="card"><div class="versus">
        <div class="slot">${ava(P('A').avatar, 'lg')}<b>${nickOf('A')}</b></div>
        <div class="vs">VS</div>
        <div class="slot"><div class="empty-slot">?</div><b class="muted">чекаємо…</b></div>
      </div></div>
      <button class="btn" id="btnShare">📨 Надіслати запрошення</button>
      <button class="btn ghost small" id="btnCopy">Скопіювати посилання</button>
      <div class="linkbox sel" id="lobbyLink"></div>
      <div class="status" id="lobbyStatus"></div>
      <button class="btn ghost small" id="btnLeave">Вийти</button>`;
    $('#btnShare', el).onclick = shareInvite;
    $('#btnCopy', el).onclick = copyInvite;
    $('#lobbyLink', el).textContent = inviteURL();
    $('#btnLeave', el).onclick = leaveRoom;
  }
  const st = $('#lobbyStatus', el);
  st.innerHTML = Net.ready() ? '<span class="dots"><i></i><i></i><i></i></span> Кімната відкрита, чекаємо на друга' : `<span class="spin"></span>${esc(Net.statusText())}`;
}

/* ---------- game view ---------- */
let lastScores = {};
function renderTop() {
  const seat = (r, right) => {
    const p = P(r);
    const online = r === ROLE ? Net.ready() : Net.partnerOnline();
    let role = '';
    if (S.phase === 'write' || S.phase === 'guess') role = S.author === r ? '✍️' : '🤔';
    return `<div class="pl ${right ? 'right' : ''} ${(S.phase === 'write' || S.phase === 'guess') && S.author === r ? 'turn' : ''}">
      <span class="dot ${online ? 'on' : ''}"></span>${ava(p.avatar, 'sm')}<span class="role">${role}</span>
      <div class="meta"><div class="nm">${esc(p.nick)}</div><div class="sc" data-r="${r}">${p.score}</div></div></div>`;
  };
  const top = $('#top');
  top.innerHTML = seat(ROLE, false) + `<button class="menu-btn" id="btnMenu" aria-label="Меню">⋯</button>` + seat(other(ROLE), true);
  $('#btnMenu').onclick = openMenu;
  ['A', 'B'].forEach((r) => {
    const sc = P(r).score;
    if (lastScores[r] != null && lastScores[r] !== sc) $(`.sc[data-r="${r}"]`, top).classList.add('bump');
    lastScores[r] = sc;
  });
}
function renderBanner() {
  const b = $('#banner');
  let msg = '';
  if (ROLE === 'B' && !Net.conn) msg = `<span class="spin"></span> Зв'язок перервався — перепідключаємось…`;
  else if (ROLE === 'A' && !Net.partnerOnline()) msg = `💤 ${nickOf('B')} поза грою — чекаємо, поки повернеться`;
  else if (!Net.ready()) msg = `<span class="spin"></span> ${esc(Net.statusText())}`;
  const k = msg ? 'x' + msg : '';
  if (b.dataset.k === k) return;
  b.dataset.k = k;
  b.innerHTML = msg ? `<div class="banner">${msg}</div>` : '';
}

function stageKey() {
  let k = S.phase + '|' + S.round;
  if (['write', 'guess', 'reveal'].includes(S.phase)) k += '|' + (S.author === ROLE ? 'a' : 'g');
  if (S.phase === 'mirror-self') k += '|' + (S.m.self[ROLE] != null);
  if (S.phase === 'mirror-guess') k += '|' + (S.m.guess[ROLE] != null);
  return k;
}

function renderGame() {
  const first = show('game');
  renderTop();
  renderBanner();
  const k = stageKey();
  if (k !== lastStageKey || first) {
    lastStageKey = k;
    const stage = $('#stage');
    stage.className = 'enter';
    stage.innerHTML = '';
    buildStage(stage);
    void stage.offsetWidth;
    if (!first) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  patchStage();
  maybeFlip();
  chatTick();
}

const roundTag = () => `<span class="tag">Раунд ${S.round}</span>`;
function optButtons(options, cls = '') {
  return options.map((o, i) => `<button class="opt ${cls}" data-i="${i}" style="--c:${OPT_COLORS[i]}">
    <span class="let">${LETTERS[i]}</span><span class="tx">${esc(o)}</span><span class="badge hidden"></span><span class="finger">👈</span></button>`).join('');
}
function qCard(r, text, label) {
  return `<div class="card qcard">${ava(P(r).avatar, 'sm')}<div style="min-width:0"><div class="who">${label}</div><div class="qtext">${esc(text)}</div></div></div>`;
}

function buildStage(st) {
  const me = ROLE, them = other(ROLE);
  const amAuthor = S.author === me;
  switch (S.phase) {
    case 'write':
      if (amAuthor) buildWrite(st);
      else st.innerHTML = `
        <div class="card wait">
          <div class="ava xl bob">${avatarSVG(P(them).avatar)}</div>
          ${roundTag()}
          <h2>${nickOf(them)} вигадує питання про себе</h2>
          <div class="typing off" id="typing"><span class="dots"><i></i><i></i><i></i></span> пише…</div>
          <p class="muted" style="margin:0">Поки чекаєш — придумай, що загадаєш ти 😉</p>
        </div>`;
      break;

    case 'guess':
      if (!amAuthor) {
        st.innerHTML = `
          <div class="stage-head">${roundTag()}<h2>Вгадуй! 🤔</h2></div>
          ${qCard(them, S.q.text, nickOf(them) + ' про себе:')}
          <div class="opts" id="opts">${optButtons(S.q.options)}</div>
          <div class="card"><div class="lbl">Яку ставку робиш?</div>
            <div class="seg" id="stake">
              <button data-s="1" type="button"><span class="e">🤔</span><b>1</b><small>навмання</small></button>
              <button data-s="2" type="button"><span class="e">🙂</span><b>2</b><small>здається</small></button>
              <button data-s="3" type="button"><span class="e">😎</span><b>3</b><small>точно знаю</small></button>
            </div>
            <p class="hint" style="margin:12px 0 0">Влучаєш — отримуєш стільки очок. Мимо — втрачаєш.</p></div>
          <button class="btn" id="btnAnswer" disabled>Відповісти</button>`;
        $('#opts', st).onclick = (e) => {
          const b = e.target.closest('.opt'); if (!b) return;
          const i = +b.dataset.i;
          if (S.q.pick === i) return;
          dispatch({ k: 'pick', i });
        };
        $('#stake', st).onclick = (e) => {
          const b = e.target.closest('button'); if (!b) return;
          dispatch({ k: 'stake', s: +b.dataset.s });
        };
        $('#btnAnswer', st).onclick = (e) => { e.currentTarget.disabled = true; e.currentTarget.dataset.sent = '1'; dispatch({ k: 'answer' }); };
      } else {
        st.innerHTML = `
          <div class="stage-head">${roundTag()}<h2>${nickOf(them)} вгадує 👀</h2>
            <p class="muted" id="hesitate">Дивись, куди тягнеться палець…</p></div>
          ${qCard(me, S.q.text, 'Твоє питання:')}
          <div class="opts" id="opts">${optButtons(S.q.options)}</div>
          <div class="card center" style="padding:14px"><span class="muted">Ставка:</span> <b class="disp" id="stakeLive" style="font-size:20px">1</b> <span id="stakeEmoji" style="font-size:22px">🤔</span></div>`;
        $$('.opt', st).forEach((b, i) => {
          b.disabled = true;
          if (i === S.q.correct) { const bd = $('.badge', b); bd.textContent = '✓ правда'; bd.classList.remove('hidden'); }
        });
      }
      break;

    case 'reveal': buildReveal(st, amAuthor); break;
    case 'mirror-self':
    case 'mirror-guess': buildMirror(st); break;
    case 'mirror-reveal': buildMirrorReveal(st); break;
  }
}

/* --- write --- */
let draft = null;
function saveDraft() { store.set('draft:' + CODE, draft); }
function buildWrite(st) {
  draft = store.get('draft:' + CODE, null);
  if (!draft || draft.round !== S.round) draft = { round: S.round, text: '', options: ['', '', ''], correct: null };
  st.innerHTML = `
    <div class="stage-head">${roundTag()}<h2>Твій хід ✍️</h2>
      <p class="muted">Напиши факт або питання про себе — а ${nickOf(other(ROLE))} вгадуватиме.</p></div>
    <div class="card">
      <label class="lbl" for="qText">Факт або питання</label>
      <textarea id="qText" rows="3" maxlength="160" placeholder="Наприклад: мій перший концерт був…"></textarea>
      <div class="row" style="margin:12px 0 18px">
        <button class="chip" id="btnIdea" type="button">🎲 Підкинь тему</button>
        <button class="chip" id="btnTF" type="button">⚖️ Правда чи брехня</button>
      </div>
      <label class="lbl">Варіанти відповіді</label>
      <p class="hint">Натисни на літеру біля правильного варіанту ✓</p>
      <div id="optsEdit"></div>
      <button class="chip" id="btnAdd" type="button">+ ще варіант</button>
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="btnAsk">Загадати ➜</button>`;
  const ta = $('#qText', st);
  ta.value = draft.text;
  const sendTyping = throttle(() => Net.send({ t: 'typing' }), 900);
  ta.addEventListener('input', () => { draft.text = ta.value; saveDraft(); sendTyping(); });
  const box = $('#optsEdit', st);
  const drawOpts = (focusIdx) => {
    box.innerHTML = draft.options.map((o, i) => `
      <div class="optedit ${draft.correct === i ? 'ok' : ''}" style="--c:${OPT_COLORS[i]}">
        <button class="mark" data-i="${i}" type="button" aria-label="Правильна відповідь">${draft.correct === i ? '✓' : LETTERS[i]}</button>
        <input type="text" data-i="${i}" maxlength="60" placeholder="Варіант ${LETTERS[i]}" value="${esc(o)}">
        ${draft.options.length > 2 ? `<button class="rm" data-i="${i}" type="button" aria-label="Прибрати">✕</button>` : '<span style="width:34px"></span>'}
      </div>`).join('');
    $('#btnAdd', st).classList.toggle('hidden', draft.options.length >= 4);
    if (focusIdx != null) { const inp = $(`input[data-i="${focusIdx}"]`, box); if (inp) inp.focus(); }
  };
  box.addEventListener('input', (e) => {
    if (e.target.matches('input')) { draft.options[+e.target.dataset.i] = e.target.value; saveDraft(); sendTyping(); }
  });
  box.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +b.dataset.i;
    if (b.classList.contains('mark')) { draft.correct = draft.correct === i ? null : i; }
    else if (b.classList.contains('rm')) {
      draft.options.splice(i, 1);
      if (draft.correct === i) draft.correct = null; else if (draft.correct > i) draft.correct--;
    }
    saveDraft(); drawOpts();
  });
  $('#btnAdd', st).onclick = () => { if (draft.options.length < 4) { draft.options.push(''); saveDraft(); drawOpts(draft.options.length - 1); } };
  $('#btnIdea', st).onclick = () => {
    let idea = pick(IDEAS);
    if (idea === ta.value) idea = pick(IDEAS);
    ta.value = idea; draft.text = idea; saveDraft();
    ta.classList.remove('pop'); void ta.offsetWidth; ta.classList.add('pop');
    ta.focus(); ta.setSelectionRange(idea.length, idea.length);
  };
  $('#btnTF', st).onclick = () => {
    draft.options = ['Правда', 'Брехня']; draft.correct = null;
    if (!ta.value.trim()) ta.placeholder = 'Напиши твердження про себе — правдиве чи ні';
    saveDraft(); drawOpts();
    toast('Тепер познач: це правда чи брехня 😏');
  };
  $('#btnAsk', st).onclick = () => {
    const err = $('#err', st);
    const text = draft.text.trim();
    const filled = draft.options.map((o) => o.trim());
    let msg = '';
    if (!text) msg = 'Напиши факт або питання 🙂';
    else if (filled.some((o) => !o)) msg = 'Заповни всі варіанти (або прибери зайвий ✕)';
    else if (draft.correct == null) msg = 'Познач правильний варіант — натисни на літеру';
    if (msg) {
      err.textContent = msg;
      const card = st.querySelector('.card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      return;
    }
    err.textContent = '';
    if (dispatch({ k: 'ask', text, options: filled, correct: draft.correct })) store.del('draft:' + CODE);
  };
  drawOpts();
}

/* --- reveal --- */
function buildReveal(st, amAuthor) {
  const q = S.q, them = other(ROLE);
  const guesser = amAuthor ? them : ROLE;
  const d = q.delta > 0 ? '+' + q.delta : '−' + Math.abs(q.delta);
  const title = amAuthor ? (q.ok ? `${nickOf(guesser)} влучає! 🎯` : `${nickOf(guesser)} не вгадує 🙈`) : (q.ok ? 'Влучно! 🎯' : 'Мимо! 🙈');
  const sub = !amAuthor && !q.ok ? `Правильно: «${esc(q.options[q.correct])}»` : (q.changes > 1 ? `Передумувань: ${q.changes - 1} 😏` : '');
  st.innerHTML = `
    <div class="result ${q.ok ? '' : 'bad'} pop"><div class="big">${title}</div><div class="delta">${d} ${q.stake === 3 ? '😎' : q.stake === 2 ? '🙂' : '🤔'}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    ${qCard(S.author, q.text, (amAuthor ? 'Твоє питання' : nickOf(S.author) + ' про себе') + ':')}
    <div class="opts">${optButtons(q.options)}</div>
    <div class="card">
      ${amAuthor
        ? `<label class="lbl" for="storyIn">Історія за фактом</label><textarea id="storyIn" rows="2" maxlength="200" placeholder="Розкажи, як так вийшло… (можна пропустити)"></textarea>`
        : `<div class="lbl">${nickOf(S.author)} розповідає</div><div class="story-text empty" id="storyOut">поки нічого…</div><div class="typing off" id="typing" style="margin-top:8px"><span class="dots"><i></i><i></i><i></i></span> пише…</div>`}
    </div>
    <button class="btn ${amAuthor ? 'ghost' : ''}" id="btnNext">${amAuthor ? 'Далі ➜' : 'Мій хід ➜'}</button>`;
  $$('.opt', st).forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add('right');
    else if (i === q.pick) b.classList.add('wrong');
    else b.classList.add('dim');
    if (i === q.pick) { const bd = $('.badge', b); bd.textContent = amAuthor ? P(guesser).nick + ' обирає' : 'твій вибір'; bd.classList.remove('hidden'); }
  });
  if (amAuthor) {
    const ta = $('#storyIn', st);
    ta.value = q.story || '';
    const push = throttle(() => dispatch({ k: 'story', text: ta.value.slice(0, 200) }), 350);
    const typing = throttle(() => Net.send({ t: 'typing' }), 900);
    ta.addEventListener('input', () => { push(); typing(); });
  }
  $('#btnNext', st).onclick = (e) => { e.currentTarget.disabled = true; dispatch({ k: 'next' }); };
  const fresh = store.get('fx:' + CODE, 0) !== S.round;
  if (fresh) { store.set('fx:' + CODE, S.round); setTimeout(() => confetti(q.ok), 150); vibrate(q.ok ? [30, 40, 30] : 120); }
}

/* --- mirror --- */
function buildMirror(st) {
  const m = S.m, them = other(ROLE);
  const [question, options] = MIRRORS[m.qi];
  const selfStep = S.phase === 'mirror-self';
  const mine = selfStep ? m.self[ROLE] : m.guess[ROLE];
  if (mine == null) {
    st.innerHTML = `
      <div class="mirror-banner pop">🪞 Дзеркальний раунд</div>
      <p class="muted center" style="margin:0">${selfStep ? 'Обоє відповідаєте <b>про себе</b>. Потім вгадуєте відповідь одне одного — за кожне влучання +2.' : `А тепер вгадай: <b>як відповідає ${nickOf(them)}?</b>`}</p>
      ${selfStep ? `<div class="card"><div class="qtext">${esc(question)}</div></div>` : qCard(them, question, nickOf(them) + ' відповідає:')}
      <div class="opts" id="opts">${optButtons(options)}</div>`;
    $('#opts', st).onclick = (e) => {
      const b = e.target.closest('.opt'); if (!b) return;
      b.classList.add('sel');
      $$('.opt', st).forEach((x) => (x.disabled = true));
      setTimeout(() => dispatch({ k: selfStep ? 'mself' : 'mguess', i: +b.dataset.i }), 280);
    };
  } else {
    st.innerHTML = `
      <div class="mirror-banner">🪞 Дзеркальний раунд</div>
      <div class="card wait">
        <div class="ava xl bob">${avatarSVG(P(them).avatar)}</div>
        <h2>${selfStep ? 'Твоя відповідь' : 'Твоя здогадка'}: «${esc(options[mine])}»</h2>
        <div class="donecheck" id="donecheck"></div>
        <p class="muted" style="margin:0">${nickOf(them)} ще думає…</p>
      </div>`;
  }
}
function buildMirrorReveal(st) {
  const m = S.m;
  const [question, options] = MIRRORS[m.qi];
  const col = (r) => {
    const ok = m.guess[r] === m.self[other(r)];
    return `<div class="card">${ava(P(r).avatar, 'md')}<div class="nm">${nickOf(r)}</div>
      <div><div class="k">про себе</div><div class="v">${esc(options[m.self[r]])}</div></div>
      <div><div class="k">вгадує</div><div class="v">${esc(options[m.guess[r]])}</div></div>
      <span class="pill ${ok ? '' : 'no'}">${ok ? '+2 🎯' : 'мимо'}</span></div>`;
  };
  const pct = S.mirrorCount ? Math.round((S.matchCount / S.mirrorCount) * 100) : 0;
  st.innerHTML = `
    <div class="mirror-banner pop">${m.match ? '✨ Ви однакові!' : '🪞 Ви різні — і це цікаво'}</div>
    <div class="card"><div class="qtext">${esc(question)}</div></div>
    <div class="duo">${col(ROLE)}${col(other(ROLE))}</div>
    <div class="card"><div class="lbl">Ваша схожість</div><div class="meter"><i id="meter" style="width:0"></i></div>
      <p class="hint" style="margin:10px 0 0">${S.matchCount} збіг(и) з ${S.mirrorCount} дзеркальних раундів · ${pct}%</p></div>
    <button class="btn" id="btnNext">Далі ➜</button>`;
  requestAnimationFrame(() => setTimeout(() => { const el = $('#meter', st); if (el) el.style.width = Math.max(pct, 4) + '%'; }, 120));
  $('#btnNext', st).onclick = (e) => { e.currentTarget.disabled = true; dispatch({ k: 'next' }); };
  const fresh = store.get('fx:' + CODE, 0) !== S.round;
  if (fresh) { store.set('fx:' + CODE, S.round); if (m.match || m.guess[ROLE] === m.self[other(ROLE)]) setTimeout(() => confetti(true), 150); }
}

/* --- live patches (no rebuild, keeps focus) --- */
let partnerTypingAt = 0;
function patchStage() {
  const st = $('#stage');
  const typingEl = $('#typing', st);
  if (typingEl) typingEl.classList.toggle('off', Date.now() - partnerTypingAt > 2500);
  if (S.phase === 'guess') {
    const q = S.q;
    $$('.opt', st).forEach((b, i) => b.classList.toggle('sel', q.pick === i));
    const stake = $('#stake', st);
    if (stake) $$('button', stake).forEach((b) => b.classList.toggle('on', +b.dataset.s === q.stake));
    const ans = $('#btnAnswer', st);
    if (ans && !ans.dataset.sent) ans.disabled = q.pick == null;
    const sl = $('#stakeLive', st);
    if (sl) {
      sl.textContent = q.stake;
      $('#stakeEmoji', st).textContent = ['🤔', '🙂', '😎'][q.stake - 1];
      const h = $('#hesitate', st);
      const n = (q.changes || 0) - 1;
      h.textContent = q.pick == null ? 'Дивись, куди тягнеться палець…' : n >= 2 ? `Передумує вже ${n}-й раз 😏` : n === 1 ? 'О, передумує…' : `Схиляється до «${q.options[q.pick]}»`;
    }
  }
  if (S.phase === 'reveal') {
    const out = $('#storyOut', st);
    if (out) {
      const s = (S.q.story || '').trim();
      out.textContent = s || 'поки нічого…';
      out.classList.toggle('empty', !s);
    }
  }
  const dc = $('#donecheck', st);
  if (dc) {
    const map = S.phase === 'mirror-self' ? S.m.self : S.m.guess;
    dc.innerHTML = [ROLE, other(ROLE)].map((r) => `<span>${ava(P(r).avatar, 'xs')} ${map[r] != null ? '✓ готово' : '<span class="dots"><i></i><i></i><i></i></span>'}</span>`).join('');
  }
}

function maybeFlip() {
  if (!S.flip || store.get('flip:' + CODE, false)) return;
  store.set('flip:' + CODE, true);
  openSheet(`
    <div class="center"><h3>Жереб кидається…</h3></div>
    <div class="coin">🪙</div>
    <div class="center" id="flipRes" style="opacity:0;transition:opacity .4s"><div class="ava lg pop" style="margin:0 auto 10px">${avatarSVG(P(S.flip).avatar)}</div>
      <h3>Перший хід — ${S.flip === ROLE ? 'твій!' : nickOf(S.flip)}</h3></div>
    <button class="btn" id="flipOk">Погнали! 🍂</button>`, (b) => {
    setTimeout(() => { const r = $('#flipRes', b); if (r) r.style.opacity = 1; }, 1300);
    $('#flipOk', b).onclick = closeSheet;
  });
}

/* ---------- menu & dossier ---------- */
function openMenu() {
  openSheet(`
    <h3>Меню</h3>
    <button class="btn mustard" id="mDossier">📜 Досьє — що ми дізналися</button>
    <button class="btn blue" id="mProfile">🎨 Змінити героя</button>
    <button class="btn ghost" id="mInvite">🔗 Посилання на гру</button>

    ctx.save(); roundRect(ctx, 150, 190, 160, 160, 36); ctx.clip(); ctx.drawImage(ia, 150, 190, 160, 160); ctx.restore();

  } catch (e) {}

/* =========================================================
   Game rules (same code runs on both sides)
   ========================================================= */
function newState(code) {
  return {
    app: 1, code, v: 1, phase: 'lobby', round: 0, author: 'A', prevAuthor: null, flip: null,
    players: { A: { nick: ME_PROFILE.nick, avatar: ME_PROFILE.avatar, score: 0 }, B: null },
    q: null, m: null, history: [], usedMirror: [], mirrorCount: 0, matchCount: 0, chat: [],
  };
}
function startWrite(s, author) { s.phase = 'write'; s.author = author; s.prevAuthor = author; s.q = null; s.m = null; }
function startMirror(s) {
  let free = MIRRORS.map((_, i) => i).filter((i) => !s.usedMirror.includes(i));
  if (!free.length) { s.usedMirror = []; free = MIRRORS.map((_, i) => i); }
  const qi = pick(free);
  s.usedMirror.push(qi);
  s.phase = 'mirror-self'; s.q = null; s.m = { qi, self: {}, guess: {}, match: false };
}
function startGame(s) {
  s.round = 1;
  const first = Math.random() < 0.5 ? 'A' : 'B';
  s.flip = first;
  startWrite(s, first);
}
function reduce(s, a, who) {
  const them = other(who);
  switch (a.k) {
    case 'ask':
      if (s.phase !== 'write' || s.author !== who) return false;
      if (!a.text || !Array.isArray(a.options) || a.options.length < 2 || a.options.length > 4) return false;
      s.q = { text: String(a.text).slice(0, 160), options: a.options.map((o) => String(o).slice(0, 60)), correct: a.correct | 0, pick: null, stake: 1, changes: 0, story: '' };
      s.phase = 'guess';
      return true;
    case 'pick':
      if (s.phase !== 'guess' || s.author === who || s.q.pick === a.i) return false;
      if (a.i < 0 || a.i >= s.q.options.length) return false;
      s.q.pick = a.i; s.q.changes = (s.q.changes || 0) + 1;
      return true;
    case 'stake':
      if (s.phase !== 'guess' || s.author === who || ![1, 2, 3].includes(a.s)) return false;
      s.q.stake = a.s;
      return true;
    case 'answer': {
      if (s.phase !== 'guess' || s.author === who || s.q.pick == null) return false;
      const q = s.q;
      q.ok = q.pick === q.correct;
      q.delta = q.ok ? q.stake : -q.stake;
      s.players[who].score += q.delta;
      s.history.push({ type: 'fact', author: s.author, round: s.round, text: q.text, options: q.options, correct: q.correct, pick: q.pick, stake: q.stake, ok: q.ok, story: '' });
      s.phase = 'reveal';
      return true;
    }
    case 'story': {
      if (s.phase !== 'reveal' || s.author !== who) return false;
      s.q.story = String(a.text || '').slice(0, 200);
      const h = s.history[s.history.length - 1];
      if (h && h.type === 'fact' && h.round === s.round) h.story = s.q.story;
      return true;
    }
    case 'next':
      if (s.phase !== 'reveal' && s.phase !== 'mirror-reveal') return false;
      s.round++;
      if (s.round % 5 === 0) startMirror(s);
      else startWrite(s, other(s.prevAuthor));
      return true;
    case 'mself':
      if (s.phase !== 'mirror-self' || s.m.self[who] != null) return false;
      s.m.self[who] = a.i;
      if (s.m.self[them] != null) s.phase = 'mirror-guess';
      return true;
    case 'mguess':
      if (s.phase !== 'mirror-guess' || s.m.guess[who] != null) return false;
      s.m.guess[who] = a.i;
      if (s.m.guess[them] != null) {
        const m = s.m;
        ['A', 'B'].forEach((r) => { if (m.guess[r] === m.self[other(r)]) s.players[r].score += 2; });
        m.match = m.self.A === m.self.B;
        s.mirrorCount++;
        if (m.match) s.matchCount++;
        s.history.push({ type: 'mirror', round: s.round, qi: m.qi, self: clone(m.self), guess: clone(m.guess), match: m.match });
        s.phase = 'mirror-reveal';
      }
      return true;
    case 'profile':
      if (!s.players[who]) return false;
      s.players[who].nick = String(a.nick || '').slice(0, 16) || s.players[who].nick;
      s.players[who].avatar = a.avatar || s.players[who].avatar;
      return true;
    case 'chat': {
      const t = String(a.text || '').trim().slice(0, 300);
      if (!t) return false;
      s.chat = (s.chat || []).concat({ r: who, t, ts: Date.now() }).slice(-150);
      return true;
    }
    case 'restart':
      if (s.phase === 'lobby') return false;
      s.players.A.score = 0; if (s.players.B) s.players.B.score = 0;
      s.history = []; s.mirrorCount = 0; s.matchCount = 0; s.usedMirror = [];
      s.round = 1;
      startWrite(s, other(s.prevAuthor || 'B'));
      return true;
  }
  return false;
}

function dispatch(a) {
  if (!S) return false;
  if (ROLE === 'A') {
    if (reduce(S, a, 'A')) commit();
    return true;
  }
  if (!Net.conn) { toast('Немає зв\'язку… зачекай секунду 🔌'); return false; }
  const c = clone(S);
  if (reduce(c, a, 'B')) { S = c; persist(); render(); }
  Net.send({ t: 'act', a });
  return true;
}
function persist() {
  if (!S) return;
  store.set('state:' + CODE, S);
  const partner = S.players[other(ROLE)];
  store.set('lastRoom', { hash: location.hash, partner: partner ? partner.nick : '', code: CODE });
}
function commit() {   // host only
  S.v++;
  persist();
  Net.send({ t: 'state', s: S });
  render();
  announceRoom();
}

/* =========================================================
   Network — через relay.js (публічні MQTT-брокери, шифрування ключем кімнати)
   ========================================================= */
const Net = {
  relay: null, linked: false, lastSeen: 0, visibleAt: 0, upAt: 0, partnerSession: null,
  hostAway: false, diag: { server: false, found: false }, since: 0, status: 'Підключаємося до сервера гри…', hb: null,
  get conn() { return this.linked; },
  ready() { return !!(this.relay && this.relay.up); },
  partnerOnline() { return this.linked; },
  statusText() { return this.status; },
  send(m) { if (this.relay) this.relay.send(other(ROLE), m); },

  start() {
    this.stop();
    this.linked = false; this.lastSeen = 0; this.hostAway = false; this.partnerSession = null;
    this.diag = { server: false, found: false };
    this.status = 'Підключаємося до сервера гри…';
    this.relay = new Relay({ app: 'vgadai', code: CODE, me: ROLE, onMessage: (f, m, s) => this.receive(f, m, s), onStatus: (up) => this.onStatus(up) });
    this.relay.start();
    this.hb = setInterval(() => this.heartbeat(), 2500);
  },
  stop() {
    clearInterval(this.hb);
    if (this.relay) this.relay.stop();
    this.relay = null; this.linked = false;
  },
  onStatus(up) {
    this.diag.server = up > 0;
    if (up) {
      this.upAt = this.upAt || Date.now();
      this.status = this.linked ? 'Онлайн' : ROLE === 'B' ? 'Сервер на зв’язку — шукаємо гру…' : 'Онлайн';
      if (ROLE === 'B') { if (!this.linked) this.hello(); } else this.send({ t: 'hostup' });
    } else {
      this.upAt = 0;
      this.status = 'Підключаємося до сервера гри…';
    }
    render();
  },
  hello() { this.send({ t: 'hello', profile: ME_PROFILE, state: S }); },
  receive(from, m, session) {
    if (from !== other(ROLE) || !m) return;
    this.lastSeen = Date.now();
    if (!this.linked) {
      if (ROLE === 'A' && m.t !== 'hello') { this.send({ t: 'who' }); return; }   // господар «впізнає» гостя лише за привітанням
      this.linked = true; this.hostAway = false; this.diag.found = true; this.status = 'Онлайн';
      render();
    }
    if (ROLE === 'B' && (m.t === 'who' || m.t === 'hostup')) { this.hello(); return; }
    if (m.t === 'hello') { m.fresh = this.partnerSession !== session; this.partnerSession = session; }
    onMessage(m);
  },
  heartbeat() {
    if (!this.ready()) return;
    const now = Date.now();
    if (this.linked && now - Math.max(this.lastSeen, this.visibleAt) > 10000) {
      this.linked = false; this.partnerSession = null;
      this.status = ROLE === 'B' ? 'Сервер на зв’язку — шукаємо гру…' : 'Онлайн';
      render();
    }
    if (ROLE === 'B' && !this.linked) {
      this.hello();
      const away = this.upAt && now - this.upAt > 7000;
      if (away !== this.hostAway) { this.hostAway = away; render(); }
    } else if (this.linked) this.send({ t: 'ping' });
  },
  wake() {   // сторінка знову видима (iOS заморожує фонові вкладки)
    this.visibleAt = Date.now();
    if (!this.relay) return;
    this.relay.wake();
    if (this.linked) this.send({ t: 'ping' });
    else if (ROLE === 'B') this.hello();
    else this.send({ t: 'hostup' });
  },
};

function onMessage(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'ping': return;
    case 'hello':
      if (ROLE !== 'A' || !m.profile) return;
      {
        // якщо господар втратив стан (інший браузер / очищено), а в гостя він є — беремо в гостя
        if (m.state && m.state.code === CODE && S.round === 0 && (m.state.v || 0) > S.v) S = m.state;
        const prev = S.players.B;
        S.players.B = { nick: String(m.profile.nick || 'Гість').slice(0, 16), avatar: m.profile.avatar || {}, score: prev ? prev.score : 0 };
        S.players.A.nick = ME_PROFILE.nick; S.players.A.avatar = ME_PROFILE.avatar;
        const firstTime = S.phase === 'lobby';
        if (firstTime) startGame(S);
        commit();
        if (m.fresh) toast(firstTime ? `${esc(S.players.B.nick)} у грі! 🎉` : `${esc(S.players.B.nick)} повертається 👋`);
      }
      return;
    case 'state':
      if (ROLE !== 'B' || !m.s || m.s.code !== CODE) return;
      if (S && S.code === m.s.code && (m.s.v || 0) < (S.v || 0)) return;   // запізнілий старіший стан
      {
        const wasNone = !S || S.phase === 'lobby';
        S = m.s; persist(); render();
        if (wasNone && S.phase !== 'lobby') toast(`Ти в грі! Напроти — ${esc(S.players.A.nick)} 🍂`);
      }
      return;
    case 'act':
      if (ROLE !== 'A') return;
      if (reduce(S, m.a || {}, 'B')) commit();
      else Net.send({ t: 'state', s: S });
      return;
    case 'typing':
      partnerTypingAt = Date.now();
      if (VIEW === 'game') patchStage();
      setTimeout(() => { if (VIEW === 'game') patchStage(); }, 2600);
      return;
    case 'emoji':
      if (REACTIONS.includes(m.e)) { floatEmoji(m.e, false); vibrate(20); }
      return;
  }
}

/* =========================================================
   Flow
   ========================================================= */
function render() {
  if (!CODE) return;
  if (!S || (ROLE === 'B' && S.phase === 'lobby')) renderConnect();
  else if (S.phase === 'lobby') renderLobby();
  else renderGame();
}
function randomCode() {
  const a = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  const buf = new Uint32Array(9);
  crypto.getRandomValues(buf);
  buf.forEach((n) => { s += a[n % a.length]; });
  return s;
}
function createRoom() {
  CODE = randomCode();
  ROLE = 'A';
  HOST_NICK = ME_PROFILE.nick;
  store.set('hosted:' + CODE, true);
  S = newState(CODE);
  history.replaceState(null, '', '#r=' + CODE + '&n=' + encodeURIComponent(ME_PROFILE.nick));
  persist();
  enterRoom();
}
function enterRoom() {
  VIEW = null; lastStageKey = null; lastScores = {}; chatKnown = -1;
  if (ROLE === 'A' && !S) S = newState(CODE);
  if (ROLE === 'A') { S.players.A.nick = ME_PROFILE.nick; S.players.A.avatar = ME_PROFILE.avatar; }
  render();
  Net.start();
  startAnnounce();
}
function leaveRoom() {
  stopAnnounce();
  Net.stop();
  CODE = null; S = null; ROLE = null; HOST_NICK = '';
  history.replaceState(null, '', location.pathname + location.search);
  VIEW = null;
  renderHome();
}
function parseHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  return { code: (p.get('r') || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 16), nick: (p.get('n') || '').slice(0, 16), j: p.get('j') === '1' };
}
function boot() {
  Net.stop();
  VIEW = null;
  clearInterval(annTimer);
  const { code, nick, j } = parseHash();
  if (!code) { CODE = null; S = null; renderHome(); return; }
  CODE = code; HOST_NICK = nick;
  ROLE = store.get('hosted:' + code, false) ? 'A' : 'B';
  S = store.get('state:' + code, null);
  if (S && S.code !== code) S = null;
  const wantJoin = JOIN_NOW === code || j;
  JOIN_NOW = null;
  if (ME_PROFILE && (ROLE === 'A' || S) || (ME_PROFILE && wantJoin)) enterRoom();
  else renderHome();
}
window.addEventListener('hashchange', boot);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && CODE) Net.wake(); });
window.addEventListener('pageshow', (e) => { if (e.persisted && CODE) Net.wake(); });
window.addEventListener('pagehide', () => { /* тримаємо стан у localStorage — повернемось */ });

if (typeof mqtt === 'undefined' || typeof Relay === 'undefined' || !window.crypto || !crypto.subtle) {
  document.getElementById('app').innerHTML = '<div class="card wait"><h2>Не вдалося завантажити гру 😕</h2><p class="muted">Перевір інтернет і онови сторінку.</p></div>';
} else {
  boot();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {}); });
}
</script>
